<style>
  :root{--ink:#0B1F3F;--night:#12305C;--beam:#F2B01E;--sand:#FAF6EF;--slate:#4A5B72;

  .miss{background:var(--miss)}.good{background:var(--good)}

  .gloss{font-size:12.5px;color:#64748b;margin:-8px 0 14px}

  .bonusbox span{display:block;color:var(--slate);font-size:13.5px;margin-bottom:12px}
  .stretch{background:#6B4E00}
  .tiny{font-size:11.5px;color:#94a3b8;margin-top:8px}
</style>
</head>

function emptyForm(){return {subject:"Maths",prompt:"",errorType:"",answer:"",note:""};}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));}
function readLocal(key){
  try{return localStorage.getItem(key);}
  catch(e){storageWarning="Beacon cannot read its saved data on this device.";return null;}
}
function writeLocal(key,value){
  try{localStorage.setItem(key,value);return true;}
  catch(e){storageWarning="Beacon could not save this change. Please tell Dad before closing the app.";return false;}
}
function removeLocal(key){try{localStorage.removeItem(key);return true;}catch(e){return false;}}
function readNum(key){const v=Number(readLocal(key));return Number.isFinite(v)?v:0;}
function standalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
function examFor(subject){return EXAMS[subject]||Infinity;}
function inFinalWindow(subject){const e=examFor(subject),t=today();return Number.isFinite(e)&&t>=e-FINAL_WINDOW_DAYS*DAY&&t<e;}
function examActive(subject){return today()<examFor(subject);}
function needsFinalSweep(c){const e=examFor(c.subject);return inFinalWindow(c.subject)&&c.finalSweep!==e;}
function clone(v){return JSON.parse(JSON.stringify(v));}

function normalizeCard(c){
  const out={...c,
    origin:c.origin || (String(c.id||"").startsWith("m-")||String(c.id||"").startsWith("s:") ? "mistake" : "seed"),
    attempt:c.attempt||"",
    note:c.note||"",
    lastReviewed:c.lastReviewed||0,
    finalSweep:c.finalSweep||0,
    errors:Array.isArray(c.errors)?c.errors:[],
    errorCount:Number.isFinite(c.errorCount)?c.errorCount:(Array.isArray(c.errors)?c.errors.length:0),
    lastMissedAt:c.lastMissedAt||0,
    source:c.source||"",
    sourceStretchId:c.sourceStretchId||""
  };
  const meta=BUILTIN_META[out.id];
  if(meta)Object.assign(out,meta);
  return out;
}
function normalizeDeck(list){return list.map(normalizeCard);}
function normalizeMeta(m){
  if(!m||m.date!==today())return {date:today(),done:0,bonusDone:0,currentBonusId:null};
  return {
    date:today(),
    done:Math.max(0,Math.min(PLAN.length,Number(m.done)||0)),
    bonusDone:Math.max(0,Math.min(MAX_BONUS,Number(m.bonusDone)||0)),
    currentBonusId:typeof m.currentBonusId==="string"?m.currentBonusId:null
  };
}
function normalizeStretchState(s){
  const out={};
  if(s&&typeof s==="object"){
    Object.keys(s).forEach(id=>{
      const x=s[id]||{};
      out[id]={lastSeen:Number(x.lastSeen)||0,lastServedAt:Number(x.lastServedAt)||0,
               promoted:!!x.promoted,lastResult:x.lastResult||""};
    });
  }
  return out;
}
function newState(cards,meta,stretchState){
  return {version:"19e",cards:normalizeDeck(cards),meta:normalizeMeta(meta),stretchState:normalizeStretchState(stretchState)};
}
function reconcileStretchState(){
  state.cards.forEach(c=>{
    if(c.source==="stretch"&&c.sourceStretchId){
      const x=state.stretchState[c.sourceStretchId]||{lastSeen:0,lastServedAt:0,promoted:false,lastResult:""};
      x.promoted=true;state.stretchState[c.sourceStretchId]=x;
    }
  });
  if(state.meta.currentBonusId){
    const s=STRETCH.find(x=>x.id===state.meta.currentBonusId);
    const x=state.stretchState[state.meta.currentBonusId];
    if(!s||!examActive(s.subject)||(x&&x.promoted))state.meta.currentBonusId=null;
  }
}
function persistState(markChange=true){
  let ok=true;
  try{localStorage.setItem(STATE_KEY,JSON.stringify(state));}
  catch(e){storageWarning="Beacon could not save this change. Please tell Dad before closing the app.";return false;}

  /* Legacy mirrors preserve a clean 19d rollback path. Root state remains 19e's source of truth. */
  try{localStorage.setItem("beacon-deck",JSON.stringify(state.cards));}catch(e){ok=false;}
  try{localStorage.setItem("beacon-meta",JSON.stringify({date:state.meta.date,done:state.meta.done}));}catch(e){ok=false;}
  if(markChange){try{localStorage.setItem("beacon-last-change",String(Date.now()));}catch(e){ok=false;}}
  if(!ok)storageWarning="Beacon saved the 19e state, but its rollback mirror could not be refreshed. Back up before closing the app.";
  return true;
}
function transact(mutator,markChange=true){
  const before=clone(state);
  try{mutator(state);}
  catch(e){state=before;storageWarning="Beacon could not complete that change safely.";return false;}
  if(!persistState(markChange)){state=before;return false;}
  return true;
}
function load(){
  if(!readNum("beacon-created-at"))writeLocal("beacon-created-at",String(Date.now()));
  let loaded=false;
  const raw=readLocal(STATE_KEY);
  if(raw){
    try{
      const x=JSON.parse(raw);
      if(x&&Array.isArray(x.cards)){
        state=newState(x.cards,x.meta,x.stretchState);loaded=true;
      }
    }catch(e){storageWarning="Beacon found 19e state it could not read. It will try the 19d rollback mirror.";}
  }
  if(!loaded){
    let cards=null,meta=null;
    try{
      const rawDeck=readLocal("beacon-deck");
      if(rawDeck)cards=JSON.parse(rawDeck);
      const rawMeta=readLocal("beacon-meta");
      if(rawMeta)meta=JSON.parse(rawMeta);
    }catch(e){storageWarning="Beacon found saved data it could not read. Please restore from a backup before continuing.";}
    if(!Array.isArray(cards)||!cards.length){
      cards=SEED.map((s,i)=>normalizeCard({id:"seed-"+i,subject:s[0],prompt:s[1],attempt:"",answer:s[2],note:s[3],
        box:0,due:today(),seen:0,origin:"seed",lastReviewed:0,finalSweep:0}));
    }
    state=newState(cards,meta,{});
  }
  reconcileStretchState();
  persistState(false);
}

function meta(){state.meta=normalizeMeta(state.meta);return state.meta;}
function priorityMiss(c){return (c.origin==="mistake"&&c.box===0)||(c.box===0&&c.seen>0);}
function rank(a,b){
  const ma=priorityMiss(a)?0:1,mb=priorityMiss(b)?0:1;
  if(ma!==mb)return ma-mb;
  return a.due-b.due;
}
function finalRank(a,b){const ea=examFor(a.subject),eb=examFor(b.subject);return ea!==eb?ea-eb:rank(a,b);}
function pool(){
  const t=today();
  return state.cards.filter(c=>examActive(c.subject)&&c.lastReviewed!==t&&(c.due<=t||needsFinalSweep(c)));
}
function remaining(){return Math.max(0,Math.min(PLAN.length-meta().done,pool().length));}
function nextCard(){
  const m=meta();
  if(m.done>=PLAN.length)return null;
  const p=pool();
  if(!p.length)return null;

  const mine=p.filter(priorityMiss).sort(rank);
  if(m.done<ERROR_FIRST_SLOTS&&mine.length)return mine[0];

  const finals=p.filter(needsFinalSweep).sort(finalRank);
  if(finals.length)return finals[0];

  const slot=PLAN[m.done];
  const want=slot==="Language"?LANG:slot==="Any"?null:[slot];
  let list=want?p.filter(c=>want.indexOf(c.subject)>-1):p.slice();
  if(!list.length)list=p.slice();
  return list.sort(rank)[0];
}
function applyReviewState(c,got){
  const box=got?Math.min((Number(c.box)||0)+1,INTERVALS.length-1):0;
  c.box=box;c.seen=(Number(c.seen)||0)+1;c.lastReviewed=today();
  const exam=examFor(c.subject);
  if(inFinalWindow(c.subject)){
    c.finalSweep=exam;
    c.due=got?exam:Math.min(today()+DAY,exam-DAY);
  }else{
    let due=today()+INTERVALS[box]*DAY;
    if(Number.isFinite(exam))due=Math.min(due,exam-FINAL_WINDOW_DAYS*DAY);
    c.due=Math.max(today()+DAY,due);
  }
}
function initialWeaknessDue(subject){
  const exam=examFor(subject);
  if(inFinalWindow(subject))return Math.min(today()+DAY,exam-DAY);
  let due=today()+DAY;
  if(Number.isFinite(exam))due=Math.min(due,exam-FINAL_WINDOW_DAYS*DAY);
  return Math.max(today()+DAY,due);
}
function appendError(c,source){
  const err={at:Date.now(),type:null,note:"",source:source||"core"};
  c.errors=Array.isArray(c.errors)?c.errors:[];
  c.errors.push(err);
  c.errorCount=(Number(c.errorCount)||0)+1;
  c.lastMissedAt=err.at;
  return err;
}

function stretchEntry(id){
  if(!state.stretchState[id])state.stretchState[id]={lastSeen:0,lastServedAt:0,promoted:false,lastResult:""};
  return state.stretchState[id];
}
function eligibleStretch(){
  const t=today();
  return STRETCH.filter(s=>{
    const x=state.stretchState[s.id];
    return examActive(s.subject)&&!(x&&x.promoted)&&!(x&&x.lastSeen===t);
  });
}
function hasEligibleStretch(){return eligibleStretch().length>0;}
function chooseStretch(){
  const m=meta(),list=eligibleStretch();
  if(!list.length)return null;
  const slot=BONUS_PLAN[Math.min(m.bonusDone,BONUS_PLAN.length-1)];
  const want=slot==="Language"?LANG:[slot];
  let candidates=list.filter(s=>want.indexOf(s.subject)>-1);
  if(!candidates.length)candidates=list;
  candidates.sort((a,b)=>{
    const aa=state.stretchState[a.id]?.lastServedAt||0;
    const bb=state.stretchState[b.id]?.lastServedAt||0;
    return aa-bb || a.id.localeCompare(b.id);
  });
  return candidates[0];
}
function currentBonus(){
  const id=meta().currentBonusId;
  return id?STRETCH.find(s=>s.id===id)||null:null;
}
function serveBonus(){
  if(busy)return;
  const m=meta();
  if(m.done<PLAN.length||m.bonusDone>=MAX_BONUS||m.currentBonusId)return;
  const s=chooseStretch();
  if(!s)return;
  busy=true;
  const ok=transact(st=>{
    const mm=st.meta;
    mm.bonusDone++;
    mm.currentBonusId=s.id;
    const x=st.stretchState[s.id]||{lastSeen:0,lastServedAt:0,promoted:false,lastResult:""};
    x.lastSeen=today();x.lastServedAt=Date.now();st.stretchState[s.id]=x;
  });
  busy=false;shown=false;if(ok)render();else renderNotices();
}
function promotionId(stretchId){return "s:"+stretchId;}
function createPromotedCard(s){
  const exam=examFor(s.subject),errAt=Date.now();
  return normalizeCard({
    id:promotionId(s.id),subject:s.subject,prompt:s.prompt,answer:s.answer,note:s.note||"",
    promptPinyin:s.promptPinyin||"",answerPinyin:s.answerPinyin||"",answerGloss:s.answerGloss||"",
    attempt:"",box:0,due:initialWeaknessDue(s.subject),seen:1,origin:"mistake",
    source:"stretch",sourceStretchId:s.id,lastReviewed:today(),
    finalSweep:inFinalWindow(s.subject)?exam:0,
    errors:[{at:errAt,type:null,note:"",source:"stretch"}],errorCount:1,lastMissedAt:errAt
  });
}

function backupDue(){
  const change=readNum("beacon-last-change"),backup=readNum("beacon-last-backup");
  if(!change||change<=backup)return false;
  const baseline=backup||readNum("beacon-created-at")||change;
  return Date.now()-baseline>=BACKUP_AFTER_DAYS*DAY;
}
function renderNotices(){
  const n=document.getElementById("notices"),parts=[];
  if(storageWarning)parts.push('<div class="notice warn"><strong>Save warning.</strong> '+esc(storageWarning)+'</div>');
  if(!standalone()&&readLocal("beacon-setup-seen")!=="1"){
    parts.push('<div class="notice"><button id="dismiss-setup">Got it</button><strong>One Beacon, one device.</strong> Use D1’s main study device as the source of truth. On iPhone/iPad: Share → Add to Home Screen.</div>');
  }
  if(backupDue())parts.push('<div class="notice warn"><button id="backup-now">Back up now</button><strong>Backup check.</strong> Your Beacon has changed since the last backup.</div>');
  n.innerHTML=parts.join("");
  const ds=document.getElementById("dismiss-setup");if(ds)ds.onclick=()=>{writeLocal("beacon-setup-seen","1");renderNotices();};
  const bn=document.getElementById("backup-now");if(bn)bn.onclick=doExport;
}
function render(){
  renderNotices();
  const v=document.getElementById("view");
  document.getElementById("t-today").textContent="Today ("+remaining()+")";
  document.getElementById("t-all").textContent="All cards ("+state.cards.length+")";
  ["today","add","all"].forEach(t=>document.getElementById("t-"+t).classList.toggle("on",tab===t));
  if(tab==="today")return renderToday(v);
  if(tab==="add")return renderAdd(v);
  renderAll(v);
}
function promptExtras(c){
  return (c.promptPinyin?'<div class="pinyin">'+esc(c.promptPinyin)+'</div>':'');
}
function answerExtras(c){
  return (c.answerPinyin?'<div class="pinyin" style="margin:2px 0 8px">'+esc(c.answerPinyin)+'</div>':'')+
         (c.answerGloss?'<div class="gloss">'+esc(c.answerGloss)+'</div>':'');
}
function coachingFor(c){
  if(c.subject==="Science")return "Say the full answer out loud first. Aim for cause → process → effect.";
  if(c.subject==="Maths")return "Work it through before revealing. Ask: what changed, and what stayed the same?";
  if(c.subject==="Chinese")return "Read the Chinese first. Use the Hanyu Pinyin underneath only when you need support.";
  return "Say your full answer out loud before you reveal it.";
}

function renderToday(v){
  if(pendingClassify)return renderClassification(v);

  const m=meta();
  if(m.done>=PLAN.length){
    const b=currentBonus();
    if(b)return renderBonusCard(v,b);
    return renderCompletion(v);
  }

  const c=nextCard();
  if(!c){
    v.innerHTML='<div class="empty"><strong>Nothing due today.</strong><span>Add a mistake from today’s work and Beacon will bring it back at the next useful review.</span></div>';
    return;
  }
  v.innerHTML='<div class="card"><div class="tag '+c.subject+'">'+c.subject.toUpperCase()+' · CARD '+(m.done+1)+' OF '+PLAN.length+'</div><div class="body">'+
    '<p class="q">'+esc(c.prompt)+'</p>'+promptExtras(c)+
    (!shown
      ? '<p class="commit">'+esc(coachingFor(c))+'</p><button class="big" id="reveal">I’ve answered · Show answer</button>'
      : '<div class="a"><p>'+esc(c.answer)+'</p>'+answerExtras(c)+(c.note?'<p class="why">'+esc(c.note)+'</p>':'')+'</div>'+
        '<div class="row"><button class="miss" id="no">Missed it</button><button class="good" id="yes">Got it</button></div>')+
    '</div></div>';
  if(!shown)document.getElementById("reveal").onclick=()=>{shown=true;render();};
  else{
    document.getElementById("no").onclick=()=>gradeCore(c,false);
    document.getElementById("yes").onclick=()=>gradeCore(c,true);
  }
}
function gradeCore(c,got){
  if(busy)return;busy=true;
  let errAt=null;
  const ok=transact(st=>{
    const card=st.cards.find(x=>x.id===c.id);
    if(!card)throw new Error("missing card");
    applyReviewState(card,got);
    if(!got)errAt=appendError(card,"core").at;
    st.meta.done=Math.min(PLAN.length,(Number(st.meta.done)||0)+1);
  });
  busy=false;shown=false;
  if(ok&&got){render();return;}
  if(ok&&!got){pendingClassify={cardId:c.id,errorAt:errAt};render();return;}
  render();
}
function renderClassification(v){
  const card=state.cards.find(c=>c.id===pendingClassify.cardId);
  if(!card){pendingClassify=null;return renderToday(v);}
  v.innerHTML='<div class="caught"><strong>Beacon caught it.</strong>You won’t need to enter this question again. It will come back at the next useful review.</div>'+
    '<div class="card"><div class="body"><p class="step-title">What tripped you up?</p>'+
    '<p style="font-size:13px;color:var(--slate);margin:-6px 0 10px">Optional: add a short note first, then tap one reason. Or skip.</p>'+
    '<input id="err-note" placeholder="Optional note">'+
    '<div class="choice-grid">'+ERROR_TYPES.map(t=>'<button data-error="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>'+
    '<button class="quiet" id="skip-error">Skip · the miss is already saved</button></div></div>';
  v.querySelectorAll("[data-error]").forEach(b=>b.onclick=()=>saveClassification(b.dataset.error));
  document.getElementById("skip-error").onclick=()=>{pendingClassify=null;render();};
}
function saveClassification(type){
  if(busy)return;busy=true;
  const note=(document.getElementById("err-note")?.value||"").trim();
  const p={...pendingClassify};
  const ok=transact(st=>{
    const c=st.cards.find(x=>x.id===p.cardId);
    if(!c)return;
    const err=(c.errors||[]).find(e=>e.at===p.errorAt);
    if(err){err.type=type;err.note=note;}
    c.lastErrorType=type;c.lastErrorNote=note;
  });
  busy=false;
  if(ok){pendingClassify=null;render();}else render();
}

function renderCompletion(v){
  const m=meta(),eligible=m.bonusDone<MAX_BONUS&&hasEligibleStretch();
  let extra='';
  if(eligible){
    extra='<div class="bonusbox"><strong>Bonus Round?</strong><span>You’re already done. This is just for a harder challenge.</span>'+
      '<button class="big" id="bonus">Give me a challenge</button><div class="tiny">'+m.bonusDone+' of '+MAX_BONUS+' bonus cards used today</div></div>';
  }else if(m.bonusDone>0){
    extra='<div class="bonusbox"><strong>Bonus round complete.</strong><span>'+m.bonusDone+' challenge'+(m.bonusDone===1?'':'s')+' done today.</span></div>';
  }
  v.innerHTML='<div class="empty"><strong>All five done for today.</strong><span>You’re finished. Nice work.</span></div>'+extra;
  const b=document.getElementById("bonus");if(b)b.onclick=serveBonus;
}
function renderBonusCard(v,s){
  const m=meta();
  v.innerHTML='<div class="card"><div class="tag stretch">BONUS '+m.bonusDone+' OF '+MAX_BONUS+' · '+s.subject.toUpperCase()+' STRETCH</div><div class="body">'+
    '<p class="q">'+esc(s.prompt)+'</p>'+promptExtras(s)+
    (!shown
      ? '<p class="commit">'+esc(coachingFor(s))+'</p><button class="big" id="reveal-bonus">I’ve answered · Show answer</button>'
      : '<div class="a"><p>'+esc(s.answer)+'</p>'+answerExtras(s)+(s.note?'<p class="why">'+esc(s.note)+'</p>':'')+'</div>'+
        '<div class="row"><button class="miss" id="bonus-no">Missed it</button><button class="good" id="bonus-yes">Got it</button></div>')+
    '</div></div>';
  if(!shown)document.getElementById("reveal-bonus").onclick=()=>{shown=true;render();};
  else{
    document.getElementById("bonus-yes").onclick=()=>gradeBonus(s,true);
    document.getElementById("bonus-no").onclick=()=>gradeBonus(s,false);
  }
}
function gradeBonus(s,got){
  if(busy)return;busy=true;
  let promotedCardId=null,errAt=null;
  const ok=transact(st=>{
    if(st.meta.currentBonusId!==s.id)throw new Error("bonus changed");
    const x=st.stretchState[s.id]||{lastSeen:today(),lastServedAt:Date.now(),promoted:false,lastResult:""};
    x.lastResult=got?"got":"missed";
    if(got){
      st.stretchState[s.id]=x;
      st.meta.currentBonusId=null;
      return;
    }

    const pid=promotionId(s.id);
    let c=st.cards.find(card=>card.id===pid||card.sourceStretchId===s.id);
    if(!c){
      c=createPromotedCard(s);
      st.cards.push(c);
      errAt=c.errors[0].at;
    }else{
      promotedCardId=c.id;
      if(!x.promoted){
        applyReviewState(c,false);
        errAt=appendError(c,"stretch").at;
      }
    }
    x.promoted=true;st.stretchState[s.id]=x;
    st.meta.currentBonusId=null;
    promotedCardId=c.id;
  });
  busy=false;shown=false;
  if(!ok){render();return;}
  if(got){render();return;}
  if(promotedCardId&&errAt){pendingClassify={cardId:promotedCardId,errorAt:errAt};}
  render();
}

/* Guided external mistake capture. Drafts are isolated and expire after two days. */
function loadDraft(){
  if(editingId)return;
  const raw=readLocal(DRAFT_KEY);if(!raw)return;
  try{
    const d=JSON.parse(raw);
    if(!d||Date.now()-Number(d.updatedAt)>DRAFT_TTL){removeLocal(DRAFT_KEY);return;}
    form={...emptyForm(),...(d.form||{})};addStep=Math.max(1,Math.min(5,Number(d.step)||1));
  }catch(e){removeLocal(DRAFT_KEY);}
}
function saveDraft(){
  if(editingId)return;
  writeLocal(DRAFT_KEY,JSON.stringify({updatedAt:Date.now(),step:addStep,form}));
}
function clearDraft(){removeLocal(DRAFT_KEY);}
function renderAdd(v){
  const editing=editingId!==null;
  const heading=editing?"Edit this mistake":"Add a mistake";
  let body='<div class="card"><div class="body"><p class="step">STEP '+addStep+' OF 5</p><p class="step-title">'+heading+'</p>';

  if(addStep===1){
    body+='<label>SUBJECT</label><div class="subs">'+SUBJECTS.map(s=>'<button data-s="'+s+'"'+(form.subject===s?' class="on"':'')+'>'+s+'</button>').join("")+'</div>'+
      '<button class="big" id="next-step">Next</button>';
  }else if(addStep===2){
    body+='<label>WHAT WAS THE QUESTION?</label><textarea id="f-q" rows="5" placeholder="Capture it while it is still fresh">'+esc(form.prompt)+'</textarea>'+
      (formError?'<div class="form-error">'+esc(formError)+'</div>':'')+
      '<div class="navrow"><button class="secondary" id="back-step">Back</button><button style="background:var(--night);color:#fff" id="next-step">Next</button></div>';
  }else if(addStep===3){
    body+='<label>WHAT TRIPPED YOU UP?</label><div class="choice-grid">'+ERROR_TYPES.map(t=>'<button data-pick="'+esc(t)+'"'+(form.errorType===t?' class="on"':'')+'>'+esc(t)+'</button>').join("")+'</div>'+
      '<button class="quiet" id="back-step">Back</button>';
  }else if(addStep===4){
    body+='<label>WHAT WAS ACTUALLY REQUIRED?</label><textarea id="f-a" rows="5" placeholder="Correct answer, working or model reasoning">'+esc(form.answer)+'</textarea>'+
      (formError?'<div class="form-error">'+esc(formError)+'</div>':'')+
      '<div class="navrow"><button class="secondary" id="back-step">Back</button><button style="background:var(--night);color:#fff" id="next-step">Next</button></div>';
  }else{
    body+='<label>WHAT SHOULD YOU REMEMBER NEXT TIME?</label><textarea id="f-n" rows="3" placeholder="One short reusable rule">'+esc(form.note)+'</textarea>'+
      (formError?'<div class="form-error">'+esc(formError)+'</div>':'')+
      '<button class="big" id="save-card">'+(editing?'Save changes':'Add to The Beacon')+'</button>'+
      '<button class="quiet" id="back-step">Back</button>';
  }
  body+='</div></div>';
  v.innerHTML=body;

  v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{form.subject=b.dataset.s;saveDraft();render();});
  const q=document.getElementById("f-q");if(q)q.oninput=()=>{form.prompt=q.value;saveDraft();};
  const a=document.getElementById("f-a");if(a)a.oninput=()=>{form.answer=a.value;saveDraft();};
  const n=document.getElementById("f-n");if(n)n.oninput=()=>{form.note=n.value;saveDraft();};

  v.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{form.errorType=b.dataset.pick;addStep=4;saveDraft();render();});
  const back=document.getElementById("back-step");if(back)back.onclick=()=>{addStep=Math.max(1,addStep-1);saveDraft();render();};
  const next=document.getElementById("next-step");if(next)next.onclick=()=>{
    if(addStep===2&&!(document.getElementById("f-q").value||"").trim()){formError="Capture the question first.";render();return;}
    if(addStep===2)form.prompt=document.getElementById("f-q").value;
    if(addStep===4&&!(document.getElementById("f-a").value||"").trim()){formError="Add the correct answer or reasoning first.";render();return;}
    if(addStep===4)form.answer=document.getElementById("f-a").value;
    formError="";addStep++;saveDraft();render();
  };
  const save=document.getElementById("save-card");if(save)save.onclick=saveExternalMistake;
}
function saveExternalMistake(){
  const note=(document.getElementById("f-n")?.value||form.note||"").trim();form.note=note;
  if(!form.prompt.trim()||!form.errorType||!form.answer.trim()||!form.note.trim()){
    formError="Finish the five short steps so Beacon knows what to bring back.";render();return;
  }
  if(busy)return;busy=true;
  const ok=transact(st=>{
    const exam=examFor(form.subject);
    if(editingId){
      const c=st.cards.find(x=>x.id===editingId);
      if(!c)throw new Error("missing edit card");
      Object.assign(c,{subject:form.subject,prompt:form.prompt,attempt:"",answer:form.answer,note:form.note,
        box:0,due:initialWeaknessDue(form.subject),seen:0,lastReviewed:today(),
        finalSweep:inFinalWindow(form.subject)?exam:0,lastErrorType:form.errorType,lastErrorNote:""});
    }else{
      const at=Date.now();
      st.cards.push(normalizeCard({
        id:"m-"+at+"-"+Math.random().toString(36).slice(2,7),
        subject:form.subject,prompt:form.prompt,attempt:"",answer:form.answer,note:form.note,
        box:0,due:initialWeaknessDue(form.subject),seen:0,origin:"mistake",lastReviewed:today(),
        finalSweep:inFinalWindow(form.subject)?exam:0,
        errors:[{at,type:form.errorType,note:"",source:"external"}],errorCount:1,lastMissedAt:at,
        lastErrorType:form.errorType,lastErrorNote:"",source:"external"
      }));
    }
  });
  busy=false;
  if(!ok){render();return;}
  clearDraft();form=emptyForm();formError="";editingId=null;addStep=1;tab="today";shown=false;render();
}

function cardStatus(c){
  const exam=examFor(c.subject);
  if(today()>=exam)return "Paper completed";
  if(needsFinalSweep(c))return "Final review due";
  return "Box "+((Number(c.box)||0)+1)+" · next on "+new Date(c.due).toLocaleDateString();
}
function renderAll(v){
  v.innerHTML=state.cards.map(c=>'<div class="item"><span class="pill '+c.subject+'">'+c.subject.slice(0,4).toUpperCase()+'</span><div class="txt">'+
    esc(c.prompt.slice(0,90))+(c.prompt.length>90?'…':'')+'<div class="meta">'+esc(cardStatus(c))+
    (c.origin==="mistake"?' · MY MISTAKE':'')+(c.source==="stretch"?' · FROM STRETCH':'')+
    (c.lastErrorType?' · '+esc(c.lastErrorType):'')+'</div>'+
    (c.origin==="mistake"?'<div class="actions"><button data-edit="'+esc(c.id)+'">Edit</button><button class="delete" data-delete="'+esc(c.id)+'">Delete</button></div>':'')+
    '</div></div>').join("");
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const c=state.cards.find(x=>x.id===b.dataset.edit);if(!c)return;
    editingId=c.id;form={subject:c.subject,prompt:c.prompt,errorType:c.lastErrorType||"Didn't know it",answer:c.answer,note:c.note||""};
    formError="";addStep=1;tab="add";render();
  });
  v.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{
    const c=state.cards.find(x=>x.id===b.dataset.delete);if(!c)return;
    if(!confirm("Delete this mistake from The Beacon?"))return;
    transact(st=>{st.cards=st.cards.filter(x=>x.id!==c.id);});render();
  });
}

function doExport(){
  const payload={
    product:"The Beacon",version:"19e",exportedAt:new Date().toISOString(),
    cards:state.cards,meta:state.meta,stretchState:state.stretchState
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"),url=URL.createObjectURL(blob);
  a.href=url;a.download="the-beacon-backup-19e.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  writeLocal("beacon-last-backup",String(Date.now()));renderNotices();
}
function restorePayload(data){
  if(Array.isArray(data)){
    if(!data.length||!data.every(c=>c&&c.prompt&&c.subject&&c.answer))throw new Error("bad legacy");
    return newState(data,null,{});
  }
  if(data&&Array.isArray(data.cards)&&data.cards.length&&data.cards.every(c=>c&&c.prompt&&c.subject&&c.answer)){
    return newState(data.cards,data.meta,data.stretchState||{});
  }
  throw new Error("bad backup");
}

document.getElementById("t-today").onclick=()=>{tab="today";shown=false;editingId=null;formError="";pendingClassify=null;render();};
document.getElementById("t-add").onclick=()=>{tab="add";shown=false;editingId=null;formError="";pendingClassify=null;form=emptyForm();addStep=1;loadDraft();render();};
document.getElementById("t-all").onclick=()=>{tab="all";shown=false;editingId=null;formError="";pendingClassify=null;render();};
document.getElementById("export").onclick=doExport;
document.getElementById("restore").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result),next=restorePayload(data);
      if(!confirm("Replace the current Beacon with "+next.cards.length+" cards from this backup?"))return;
      const before=clone(state);state=next;reconcileStretchState();
      if(!persistState(true)){state=before;throw new Error("save failed");}
      writeLocal("beacon-last-backup",String(Date.now()));tab="today";shown=false;editingId=null;pendingClassify=null;render();
      alert("Restored "+state.cards.length+" cards.");
    }catch(err){alert("That file does not look like a Beacon backup.");}
  };
  r.readAsText(f);e.target.value="";
};

load();render();
</script>
