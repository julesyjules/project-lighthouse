<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Beacon">

<title>The Beacon</title>
<style>
  :root{--ink:#0B1F3F;--night:#12305C;--beam:#F2B01E;--sand:#FAF6EF;--slate:#4A5B72;
        --rule:rgba(11,31,63,.14);--good:#1F7A55;--miss:#B23A2E;--warn:#8A5A00}
  html{color-scheme:light only}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#FAF6EF}
  body{color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}

  header{background:var(--night);color:#fff;border-radius:6px;padding:22px 20px;
         padding-top:calc(22px + env(safe-area-inset-top))}
  .eyebrow{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--beam);margin:0 0 6px}
  h1{font-family:Georgia,serif;font-size:28px;margin:0 0 6px;font-weight:700}
  header p{margin:0;font-size:13.5px;color:rgba(255,255,255,.82)}

  #notices{margin:12px 0 0}
  .notice{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:11px 12px;
          margin-bottom:8px;font-size:12.5px;color:var(--slate)}
  .notice.warn{border-color:#d7b56d;background:#fffaf0;color:#6d4a00}
  .notice strong{color:var(--ink)}
  .notice button{float:right;border:0;background:none;color:var(--night);font-weight:700;
                 font-size:12px;padding:0 0 0 10px;cursor:pointer}

  nav{display:flex;gap:6px;margin:18px 0}
  nav button{flex:1;padding:10px 4px;font-size:13px;font-weight:600;border-radius:5px;
             border:1px solid var(--rule);background:#fff;color:var(--slate);cursor:pointer}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .card{background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .tag{padding:9px 16px;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#fff}
  .Maths{background:#1E3A8A}.Science{background:#166534}
  .English{background:#B45309}.Chinese{background:#9F1239}
  .body{padding:22px 20px}
  .q{font-size:17px;line-height:1.5;margin:0 0 18px}
  .commit{font-size:13px;color:var(--slate);background:#f7f8fa;border-radius:5px;padding:10px 12px;margin:0 0 12px}
  .a{border-left:4px solid var(--beam);padding-left:14px;margin-bottom:18px}
  .a p{margin:0 0 8px}
  .a .why{font-size:13.5px;color:var(--slate);font-style:italic;margin:0}

  button.big{width:100%;padding:14px;border:none;border-radius:5px;font-size:15px;
             font-weight:700;color:#fff;background:var(--night);cursor:pointer}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:14px;border:none;border-radius:5px;font-size:15px;
              font-weight:700;color:#fff;cursor:pointer}
  .miss{background:var(--miss)}.good{background:var(--good)}

  label{display:block;font-size:10.5px;letter-spacing:.12em;font-weight:700;
        color:var(--slate);margin:0 0 6px}
  textarea,input{width:100%;border:1px solid #cbd5e1;border-radius:5px;padding:11px;
                 font:inherit;font-size:15px;margin-bottom:16px;background:#fff;color:var(--ink)}
  textarea{resize:vertical}
  .subs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .subs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:5px;
               font-size:13px;font-weight:600;background:#e8eaee;color:var(--slate);cursor:pointer}
  .subs button.on{background:var(--ink);color:#fff}
  .form-error{font-size:12.5px;color:var(--miss);margin:-6px 0 14px;font-weight:600}

  .item{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px 14px;
        margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
  .pill{font-size:9.5px;font-weight:700;color:#fff;padding:4px 7px;border-radius:4px;flex:0 0 auto}
  .item .txt{flex:1;min-width:0;font-size:13.5px}
  .item .meta{font-size:11.5px;color:#94a3b8;margin-top:3px}
  .item .actions{display:flex;gap:10px;margin-top:6px}
  .item .actions button{border:0;background:none;padding:0;color:var(--night);font-size:11.5px;
                        text-decoration:underline;cursor:pointer}
  .item .actions button.delete{color:var(--miss)}

  .empty{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:40px 24px;text-align:center}
  .empty strong{display:block;font-size:18px;margin-bottom:6px}
  .empty span{font-size:14px;color:var(--slate)}
  .foot{margin-top:22px;text-align:center}
  .foot button{background:none;border:none;color:#94a3b8;font-size:12px;
               text-decoration:underline;cursor:pointer;padding:6px}


  .pinyin{font-size:12.5px;color:#64748b;margin:-12px 0 14px;font-style:italic}
  .gloss{font-size:12.5px;color:#64748b;margin:-8px 0 14px}
  .step{font-size:11px;letter-spacing:.12em;font-weight:700;color:#94a3b8;margin:0 0 8px}
  .step-title{font-size:18px;font-weight:700;margin:0 0 14px}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
  .choice-grid button{padding:11px 9px;border:1px solid var(--rule);border-radius:5px;background:#fff;
                      color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
  .choice-grid button:hover,.choice-grid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .navrow{display:flex;gap:8px;margin-top:4px}
  .navrow button{flex:1;padding:12px;border:none;border-radius:5px;font-size:14px;font-weight:700;cursor:pointer}
  .secondary{background:#64748b!important}
  .quiet{background:none;border:none;color:#64748b;text-decoration:underline;font-size:12.5px;cursor:pointer;padding:8px}
  .caught{background:#f0f7f3;border:1px solid #c9e2d4;border-radius:6px;padding:14px;margin-bottom:14px}
  .caught strong{display:block;color:var(--good);font-size:16px;margin-bottom:3px}
  .bonusbox{background:#fff8e8;border:1px solid #ecd08a;border-radius:6px;padding:16px;text-align:center;margin-top:12px}
  .bonusbox strong{display:block;font-size:18px;margin-bottom:4px}
  .bonusbox span{display:block;color:var(--slate);font-size:13.5px;margin-bottom:12px}
  .stretch{background:#6B4E00}
  .tiny{font-size:11.5px;color:#94a3b8;margin-top:8px}
  .review-prefill{background:#f7f8fa;border:1px solid var(--rule);border-radius:5px;padding:12px;margin-bottom:16px}

  /* 20b English Precision field-test patch */
  .module-nav{margin:-8px 0 18px}
  .module-nav button{width:100%;padding:11px 12px;border:1px solid #d9a21b;border-radius:5px;
                     background:#fff8e8;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}
  .module-nav button.on{background:var(--beam);border-color:var(--beam);color:var(--ink)}
  .precision-hero{background:linear-gradient(180deg,#fffaf0 0%,#fff 100%);border:1px solid #ecd08a;
                  border-radius:6px;padding:18px;margin-bottom:12px}
  .precision-hero h2{font-family:Georgia,serif;font-size:22px;margin:0 0 5px}
  .precision-hero p{margin:0;color:var(--slate);font-size:13.5px}
  .precision-rule{margin-top:10px;padding:10px 12px;background:#fff;border-left:4px solid var(--beam);
                  font-weight:700;font-size:13px}
  .precision-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
  .metric{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px}
  .metric strong{display:block;font-size:20px;line-height:1.2}
  .metric span{font-size:11.5px;color:var(--slate)}
  .ep-progress{font-size:11px;letter-spacing:.1em;font-weight:700;color:#94a3b8;margin:0 0 8px}
  .ep-context{background:#f7f8fa;border:1px solid var(--rule);border-radius:6px;padding:13px 14px;
              margin-bottom:15px;font-size:14px;line-height:1.65}
  .ep-blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--beam);color:var(--ink);font-weight:700;text-align:center}
  .confidence{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
  .confidence button{padding:10px 6px;border:1px solid var(--rule);border-radius:5px;background:#fff;
                     color:var(--slate);font-size:12px;font-weight:700;cursor:pointer}
  .confidence button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ep-review-note{background:#fff8e8;border:1px solid #ecd08a;border-radius:6px;padding:11px 12px;
                  color:#6d4a00;font-size:12.5px;margin-bottom:14px}
  .ep-good{background:#f0f7f3;border:1px solid #c9e2d4;border-radius:6px;padding:13px;margin:14px 0}
  .ep-miss{background:#fff4f2;border:1px solid #e8c2bc;border-radius:6px;padding:13px;margin:14px 0}
  .ep-good strong{color:var(--good)} .ep-miss strong{color:var(--miss)}
  .tagline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
  .tagchip{font-size:10px;font-weight:700;letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:#eef2f6;color:var(--slate)}
  .weak-list{margin:8px 0 16px;padding:0;list-style:none}
  .weak-list li{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:9px 11px;margin-bottom:6px;font-size:13px}
  .session-line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding:9px 0;font-size:12.5px}
  .session-line:first-child{border-top:0}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">PROJECT LIGHTHOUSE 2.0</p>
    <h1>The Beacon</h1>
    <p>Five cards, five minutes, at the end of the day. The ones you miss come back sooner.</p>
  </header>

  <div id="notices"></div>

  <nav>
    <button id="t-today" class="on">Today</button>
    <button id="t-add">Review mistakes</button>
    <button id="t-all">All cards</button>
  </nav>
  <div class="module-nav"><button id="t-english">English Precision</button></div>

  <main id="view"></main>

  <div class="foot">
    <button id="export">Back up my cards</button>
    <button id="restore">Restore from backup</button>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <div style="font-size:11px;color:#b6bfcb;margin-top:2px">The Beacon · Release 20b · English Precision · 2026-08-30</div>
  </div>
</div>

<script>

const SUBJECTS=["Maths","Science","English","Chinese"];

const LANG=["English","Chinese"];

const STATE_KEY="beacon-state";

const EXAMS={
  English:new Date(2026,8,24).setHours(0,0,0,0),
  Maths:new Date(2026,8,25).setHours(0,0,0,0),
  Chinese:new Date(2026,8,28).setHours(0,0,0,0),

const SEED=[
["Maths","A tank is 3/5 filled. After 12 L more it is 7/10 full. What is its capacity?","120 L. The 12 L is 7/10 − 3/5 = 1/10 of the tank.","Find what fraction the added amount represents before anything else."],
["Maths","Boys : girls = 3 : 5. There are 24 more girls than boys. How many children altogether?","96. The difference is 2 units = 24, so 1 unit = 12, and 8 units = 96.","The difference in units is the bridge between the ratio and the real number."],
["Maths","A car covers 180 km in 2 h 30 min. What is its average speed?","72 km/h. 180 ÷ 2.5.","Convert minutes into a decimal or fraction of an hour before dividing."],
["Maths","Find the area of a quadrant of radius 14 cm. Take π as 22/7.","154 cm². A quarter of the full circle, which is 22/7 × 14 × 14 = 616.","Work out the whole circle first, then take the fraction."],
["Maths","An $80 item rises 15%, then is discounted 10%. What is the final price?","$82.80. 80 × 1.15 = 92, then 92 × 0.9.","Percentages apply one after another. They are never added together."],
["Maths","The angles of a triangle are in the ratio 2 : 3 : 4. Find the largest angle.","80°. 9 units = 180°, so 1 unit = 20°, and 4 units = 80°.","The total units always map onto 180° for a triangle."],
["Science","Why does a plant kept in a dark cupboard eventually die, even if it is watered?","Without light it cannot photosynthesise, so it cannot make food, and its stored food runs out.","Name the process and the reason. 'No sunlight' on its own will not score."],
["Science","A metal spoon feels colder than a wooden one in the same room. Explain why.","Metal is a better conductor of heat, so it conducts heat away from your hand faster.","Both are at the same temperature. The answer is about the rate of heat transfer."],
["Science","In a fair test on how light affects plant growth, name one variable you must keep the same.","The amount of water. Also: soil type, pot size, type of plant, temperature.","Change one thing, measure one thing, keep everything else the same."],
["Science","A seed has a papery wing. How is it dispersed, and how does that help the plant?","By wind. It lands further from the parent plant, so there is less competition for water, sunlight and nutrients.","Always add the benefit. The mark is usually in the 'why'."],
["Science","Name the stages of a butterfly's life cycle.","Egg → larva (caterpillar) → pupa → adult. This is complete metamorphosis.","Butterfly and beetle have four stages. Grasshopper and cockroach have three."],
["Science","Why do water droplets form on the outside of a cold glass?","Water vapour in the surrounding air loses heat to the cold glass and condenses into water droplets.","Say where the water came from. It did not leak through the glass."],
["English","Combine using 'Despite': 'He was exhausted. He kept working.'","Despite being exhausted, he kept working.","'Despite' is followed by a noun or an -ing verb, never by a full clause."],
["English","Choose: 'Neither of the boys (was / were) willing to admit it.'","was — 'neither' is singular.","Look past the words sitting between the subject and the verb."],
["English","What does 'meticulous' mean? Use it in a sentence.","Extremely careful about detail. 'She kept meticulous notes of every experiment.'","Give the meaning and a natural sentence. One without the other rarely scores."],
["English","Rewrite in reported speech: 'I will finish it tomorrow,' she said.","She said that she would finish it the following day.","Shift the tense back, and change the time word too."],
["English","Choose: 'The news (is / are) encouraging.'","is — 'news' is uncountable.","Uncountable nouns take a singular verb even when they end in -s."],
["Chinese","一丝不苟 是什么意思？","形容做事非常认真细致，一点也不马虎。","成语题先想清楚它形容的是态度还是结果。"],
["Chinese","兴高采烈 用在什么情况？请造一个句子。","形容非常高兴。例：听到可以去露营，大家都兴高采烈。","成语要放进完整的句子里才算真正掌握。"],
["Chinese","填量词：一（  ）书、一（  ）花、一（  ）马","一本书、一朵花、一匹马。","量词要一组一组地记，不要单个背。"],
["Chinese","用「虽然……但是……」造一个句子。","例：虽然天气很热，但是他还是坚持跑步。","关联词要成对使用，前后句的意思要相反。"]
];

  "seed-17":{
    promptPinyin:"yī sī bù gǒu shì shén me yì si?",
    answerPinyin:"xíng róng zuò shì fēi cháng rèn zhēn xì zhì, yì diǎn yě bù mǎ hu.",
    answerGloss:"一丝不苟 (yī sī bù gǒu): meticulous; extremely careful and thorough."

  "seed-18":{

  "seed-19":{

    answerPinyin:"yì běn shū, yì duǒ huā, yì pǐ mǎ.",

    answerGloss:"虽然……但是…… (suī rán… dàn shì…): although… but…"

const STRETCH=[
  {id:"stretch-sci-001",subject:"Science",
   prompt:"Two identical glasses contain the same amount of water. Glass A contains ice while Glass B contains water at room temperature. More droplets form on the outside of Glass A. Explain why.",
   answer:"The surface of Glass A is colder, so water vapour in the surrounding air loses heat faster and more of it condenses into liquid water on the outside of the glass.",
   note:"Compare the changed condition, name the process, then state the effect."},
  {id:"stretch-sci-002",subject:"Science",
   prompt:"A plant is placed under a transparent plastic bag in sunlight. After some time, droplets appear on the inside of the bag. Explain how the droplets formed.",
   answer:"Water from the plant is lost as water vapour through transpiration. The water vapour touches the cooler inner surface of the bag, loses heat and condenses into water droplets.",

  {id:"stretch-sci-003",subject:"Science",
   prompt:"Wet clothes dry faster on a windy day than on a still day even when the temperature is the same. Explain why.",
   answer:"Wind carries away water vapour near the wet clothes, so the surrounding air is less humid and water can evaporate from the clothes faster.",

  {id:"stretch-sci-004",subject:"Science",
   prompt:"Two identical bulbs are connected to identical batteries. Circuit X has one bulb. Circuit Y has two bulbs connected in series. Why are the bulbs in Circuit Y dimmer?",
   answer:"In Circuit Y the electrical energy supplied by the battery is shared by two bulbs in the same circuit, so each bulb receives less energy per unit time and is dimmer.",
   note:"Compare the circuits and explain the energy effect, not just the observation."},

  {id:"stretch-math-001",subject:"Maths",
   prompt:"The ratio of red to blue beads is 3 : 5. After 12 red beads are added, the ratio becomes 3 : 4. How many beads were there at first?",
   answer:"128 beads. Let red = 3u and blue = 5u. After adding 12 red: (3u+12):5u = 3:4. So 4(3u+12)=15u, giving u=16. Initial total = 8u = 128.",
   note:"When only one group changes, keep the unchanged group as the invariant."},
  {id:"stretch-math-002",subject:"Maths",
   prompt:"A price is increased by 20% and then reduced by 20%. The final price is $96. What was the original price?",
   answer:"$100. The combined multiplier is 1.2 × 0.8 = 0.96. So original price = 96 ÷ 0.96 = 100.",

  {id:"stretch-math-003",subject:"Maths",

  {id:"stretch-math-004",subject:"Maths",

  {id:"stretch-eng-001",subject:"English",
   prompt:"Choose the correct verb: 'Neither the coach nor the players (was / were) prepared for the sudden change.'",
   answer:"were. With 'neither...nor', the verb agrees with the subject closer to it. 'Players' is plural.",
   note:"Find the noun nearest the verb instead of being distracted by the first subject."},
  {id:"stretch-eng-002",subject:"English",

  {id:"stretch-chi-001",subject:"Chinese",

  if(q9==="explain")items["ep-d-09"]={status:"ambiguous_item",excludeFromProfile:true,note:"‘explain the rule’ is defensible English; this item is excluded from adaptive weighting."};
  if(q14 && !q14.startsWith("grace told tom that") && q14.includes("she would return his notes") && (q14.includes("next day")||q14.includes("following day")))items["ep-d-14"]={status:"execution",profileTags:["EXE"],note:"Reported-speech shifts were correct; the required starter word ‘that’ was omitted."};
  if(q15 && q15.startsWith("it was only when") && q15.includes("had left his keys at home"))items["ep-d-15"]={status:"typo",excludeFromProfile:true,note:"Field review confirmed a typing slip; underlying It was only … that … / past-perfect structure was understood."};
  s.diagnostic.review20b={appliedAt:Date.now(),source:"human-reviewed field test",items};

  s.profile={updatedAt:Date.now(),reviewVersion:"20b",reviewSource:"human-reviewed field test",weakTags:[
    {tag:"SEM",score:18},{tag:"COL",score:13},{tag:"TENSE",score:10},{tag:"SYN",score:9},{tag:"EXE",score:7}
  ]};

}
function newEnglishState(){return {version:ENGLISH_RELEASE,diagnostic:null,profile:null,active:null,drillHistory:[]};}

  const s=(x&&typeof x==="object")?clone(x):newEnglishState();

  if(!s.active||typeof s.active!=="object")s.active=null;
  if(!s.profile||typeof s.profile!=="object")s.profile=null;

function epDiagnosticSummary(responses){

    if(!fc&&lc)catches++;if(fc&&!lc)over++;if(fc&&lc)stable++;if(!fc&&Number(r.confidence)===3)high++;
    if(!fc)q.tags.forEach(t=>tagScore[t]=(tagScore[t]||0)+(Number(r.confidence)===3?2:1));
    if(!lc)q.tags.forEach(t=>tagScore[t]=(tagScore[t]||0)+2);

  const lost=Math.max(0,max-first),recovered=Math.max(0,final-first),avoid=lost?Math.round(recovered/lost*100):100;

function persistState(markChange=true){

  try{localStorage.setItem("beacon-meta",JSON.stringify({date:state.meta.date,done:state.meta.done}));}catch(e){ok=false;}
  if(markChange){try{localStorage.setItem("beacon-last-change",String(Date.now()));}catch(e){ok=false;}}

function load(){

  let loaded=false;
  const raw=readLocal(STATE_KEY);
  if(raw){
    try{
      const x=JSON.parse(raw);

        state=newState(x.cards,x.meta,x.stretchState);loaded=true;
      }
    }catch(e){storageWarning="Beacon found 19e state it could not read. It will try the 19d rollback mirror.";}
  }
  if(!loaded){

      const rawDeck=readLocal("beacon-deck");

      const rawMeta=readLocal("beacon-meta");
      if(rawMeta)meta=JSON.parse(rawMeta);

    if(!Array.isArray(cards)||!cards.length){
      cards=SEED.map((s,i)=>normalizeCard({id:"seed-"+i,subject:s[0],prompt:s[1],attempt:"",answer:s[2],note:s[3],
        box:0,due:today(),seen:0,origin:"seed",lastReviewed:0,finalSweep:0}));

function meta(){state.meta=normalizeMeta(state.meta);return state.meta;}
function priorityMiss(c){return (c.origin==="mistake"&&c.box===0)||(c.box===0&&c.seen>0);}
function rank(a,b){
  const ma=priorityMiss(a)?0:1,mb=priorityMiss(b)?0:1;
  if(ma!==mb)return ma-mb;
  return a.due-b.due;
}
function finalRank(a,b){const ea=examFor(a.subject),eb=examFor(b.subject);return ea!==eb?ea-eb:rank(a,b);}
function pool(){
  const t=today();
  return state.cards.filter(c=>examActive(c.subject)&&c.lastReviewed!==t&&(c.due<=t||needsFinalSweep(c)));
}
function remaining(){return Math.max(0,Math.min(PLAN.length-meta().done,pool().length));}
function nextCard(){
  const m=meta();
  if(m.done>=PLAN.length)return null;
  const p=pool();
  if(!p.length)return null;

  const mine=p.filter(priorityMiss).sort(rank);
  if(m.done<ERROR_FIRST_SLOTS&&mine.length)return mine[0];

  const finals=p.filter(needsFinalSweep).sort(finalRank);
  if(finals.length)return finals[0];

  const slot=PLAN[m.done];
  const want=slot==="Language"?LANG:slot==="Any"?null:[slot];
  let list=want?p.filter(c=>want.indexOf(c.subject)>-1):p.slice();
  if(!list.length)list=p.slice();
  return list.sort(rank)[0];
}
function applyReviewState(c,got){
  const box=got?Math.min((Number(c.box)||0)+1,INTERVALS.length-1):0;
  c.box=box;c.seen=(Number(c.seen)||0)+1;c.lastReviewed=today();
  const exam=examFor(c.subject);
  if(inFinalWindow(c.subject)){
    c.finalSweep=exam;
    c.due=got?exam:Math.min(today()+DAY,exam-DAY);
  }else{
    let due=today()+INTERVALS[box]*DAY;
    if(Number.isFinite(exam))due=Math.min(due,exam-FINAL_WINDOW_DAYS*DAY);
    c.due=Math.max(today()+DAY,due);
  }
}
function initialWeaknessDue(subject){
  const exam=examFor(subject);
  if(inFinalWindow(subject))return Math.min(today()+DAY,exam-DAY);
  let due=today()+DAY;
  if(Number.isFinite(exam))due=Math.min(due,exam-FINAL_WINDOW_DAYS*DAY);
  return Math.max(today()+DAY,due);
}
function appendError(c,source){
  const err={at:Date.now(),type:null,note:"",source:source||"core"};
  c.errors=Array.isArray(c.errors)?c.errors:[];
  c.errors.push(err);
  c.errorCount=(Number(c.errorCount)||0)+1;
  c.lastMissedAt=err.at;
  return err;
}

function stretchEntry(id){

function eligibleStretch(){
  const t=today();

    const x=state.stretchState[s.id];

function chooseStretch(){
  const m=meta(),list=eligibleStretch();
  if(!list.length)return null;
  const slot=BONUS_PLAN[Math.min(m.bonusDone,BONUS_PLAN.length-1)];
  const want=slot==="Language"?LANG:[slot];
  let candidates=list.filter(s=>want.indexOf(s.subject)>-1);
  if(!candidates.length)candidates=list;
  candidates.sort((a,b)=>{
    const aa=state.stretchState[a.id]?.lastServedAt||0;
    const bb=state.stretchState[b.id]?.lastServedAt||0;
    return aa-bb || a.id.localeCompare(b.id);
  });

}

function serveBonus(){
  if(busy)return;
  const m=meta();
  if(m.done<PLAN.length||m.bonusDone>=MAX_BONUS||m.currentBonusId)return;
  const s=chooseStretch();
  if(!s)return;
  busy=true;
  const ok=transact(st=>{
    const mm=st.meta;
    mm.bonusDone++;
    mm.currentBonusId=s.id;
    const x=st.stretchState[s.id]||{lastSeen:0,lastServedAt:0,promoted:false,lastResult:""};
    x.lastSeen=today();x.lastServedAt=Date.now();st.stretchState[s.id]=x;
  });

}

}

function backupDue(){
  const change=readNum("beacon-last-change"),backup=readNum("beacon-last-backup");
  if(!change||change<=backup)return false;
  const baseline=backup||readNum("beacon-created-at")||change;
  return Date.now()-baseline>=BACKUP_AFTER_DAYS*DAY;
}
function renderNotices(){
  const n=document.getElementById("notices"),parts=[];
  if(storageWarning)parts.push('<div class="notice warn"><strong>Save warning.</strong> '+esc(storageWarning)+'</div>');
  if(epError)parts.push('<div class="notice warn"><strong>English Precision.</strong> '+esc(epError)+'</div>');
  if(!standalone()&&readLocal("beacon-setup-seen")!=="1"){
    parts.push('<div class="notice"><button id="dismiss-setup">Got it</button><strong>One Beacon, one device.</strong> Use D1’s main study device as the source of truth. On iPhone/iPad: Share → Add to Home Screen.</div>');
  }
  if(backupDue())parts.push('<div class="notice warn"><button id="backup-now">Back up now</button><strong>Backup check.</strong> Your Beacon has changed since the last backup.</div>');
  n.innerHTML=parts.join("");
  const ds=document.getElementById("dismiss-setup");if(ds)ds.onclick=()=>{writeLocal("beacon-setup-seen","1");renderNotices();};
  const bn=document.getElementById("backup-now");if(bn)bn.onclick=doExport;
}
function render(){
  renderNotices();
  const v=document.getElementById("view");
  document.getElementById("t-today").textContent="Today ("+remaining()+")";
  document.getElementById("t-add").textContent="Review mistakes ("+pendingMistakes().length+")";
  document.getElementById("t-all").textContent="All cards ("+state.cards.length+")";
  ["today","add","all"].forEach(t=>document.getElementById("t-"+t).classList.toggle("on",tab===t));
  document.getElementById("t-english").classList.toggle("on",tab==="english");
  if(tab==="english")return renderEnglish(v);
  if(tab==="today")return renderToday(v);
  if(tab==="add")return renderReviewMistakes(v);
  renderAll(v);
}
function promptExtras(c){
  return (c.promptPinyin?'<div class="pinyin">'+esc(c.promptPinyin)+'</div>':'');
}
function answerExtras(c){
  return (c.answerPinyin?'<div class="pinyin" style="margin:2px 0 8px">'+esc(c.answerPinyin)+'</div>':'')+
         (c.answerGloss?'<div class="gloss">'+esc(c.answerGloss)+'</div>':'');
}
function coachingFor(c){
  if(c.subject==="Science")return "Say the full answer out loud first. Aim for cause → process → effect.";
  if(c.subject==="Maths")return "Work it through before revealing. Ask: what changed, and what stayed the same?";
  if(c.subject==="Chinese")return "Read the Chinese first. Use the Hanyu Pinyin underneath only when you need support.";
  return "Say your full answer out loud before you reveal it.";
}

function renderToday(v){
  if(pendingClassify)return renderClassification(v);

  const m=meta();
  if(m.done>=PLAN.length){
    const b=currentBonus();
    if(b)return renderBonusCard(v,b);
    return renderCompletion(v);
  }

  const c=nextCard();
  if(!c){
    v.innerHTML='<div class="empty"><strong>Nothing due today.</strong><span>Your next review will appear when it is useful.</span></div>';
    return;
  }
  v.innerHTML='<div class="card"><div class="tag '+c.subject+'">'+c.subject.toUpperCase()+' · CARD '+(m.done+1)+' OF '+PLAN.length+'</div><div class="body">'+
    '<p class="q">'+esc(c.prompt)+'</p>'+promptExtras(c)+
    (!shown
      ? '<p class="commit">'+esc(coachingFor(c))+'</p><button class="big" id="reveal">I’ve answered · Show answer</button>'
      : '<div class="a"><p>'+esc(c.answer)+'</p>'+answerExtras(c)+(c.note?'<p class="why">'+esc(c.note)+'</p>':'')+'</div>'+
        '<div class="row"><button class="miss" id="no">Missed it</button><button class="good" id="yes">Got it</button></div>')+
    '</div></div>';
  if(!shown)document.getElementById("reveal").onclick=()=>{shown=true;render();};
  else{
    document.getElementById("no").onclick=()=>gradeCore(c,false);
    document.getElementById("yes").onclick=()=>gradeCore(c,true);
  }
}
function gradeCore(c,got){
  if(busy)return;busy=true;
  let errAt=null;
  const ok=transact(st=>{
    const card=st.cards.find(x=>x.id===c.id);
    if(!card)throw new Error("missing card");
    applyReviewState(card,got);
    if(!got)errAt=appendError(card,"core").at;
    st.meta.done=Math.min(PLAN.length,(Number(st.meta.done)||0)+1);
  });
  busy=false;shown=false;
  if(ok&&got){render();return;}
  if(ok&&!got){pendingClassify={cardId:c.id,errorAt:errAt};render();return;}
  render();
}
function renderClassification(v){
  const card=state.cards.find(c=>c.id===pendingClassify.cardId);
  if(!card){pendingClassify=null;return renderToday(v);}
  v.innerHTML='<div class="caught"><strong>Beacon caught it.</strong>You won’t need to enter this question again. It is saved in Review mistakes and will come back at the next useful review.</div>'+
    '<div class="card"><div class="body"><p class="step-title">What tripped you up?</p>'+
    '<p style="font-size:13px;color:var(--slate);margin:-6px 0 10px">Optional: add a short note first, then tap one reason. Or skip.</p>'+
    '<input id="err-note" placeholder="Optional note">'+
    '<div class="choice-grid">'+ERROR_TYPES.map(t=>'<button data-error="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>'+
    '<button class="quiet" id="skip-error">Skip · the miss is already saved</button></div></div>';
  v.querySelectorAll("[data-error]").forEach(b=>b.onclick=()=>saveClassification(b.dataset.error));
  document.getElementById("skip-error").onclick=()=>{pendingClassify=null;render();};
}
function saveClassification(type){
  if(busy)return;busy=true;
  const note=(document.getElementById("err-note")?.value||"").trim();
  const p={...pendingClassify};
  const ok=transact(st=>{
    const c=st.cards.find(x=>x.id===p.cardId);
    if(!c)return;
    const err=(c.errors||[]).find(e=>e.at===p.errorAt);
    if(err){err.type=type;err.note=note;}
    c.lastErrorType=type;c.lastErrorNote=note;
  });
  busy=false;
  if(ok){pendingClassify=null;render();}else render();
}

function renderCompletion(v){
  const m=meta(),eligible=m.bonusDone<MAX_BONUS&&hasEligibleStretch();
  let extra='';
  if(eligible){
    extra='<div class="bonusbox"><strong>Bonus Round?</strong><span>You’re already done. This is just for a harder challenge.</span>'+
      '<button class="big" id="bonus">Give me a challenge</button><div class="tiny">'+m.bonusDone+' of '+MAX_BONUS+' bonus cards used today</div></div>';
  }else if(m.bonusDone>0){
    extra='<div class="bonusbox"><strong>Bonus round complete.</strong><span>'+m.bonusDone+' challenge'+(m.bonusDone===1?'':'s')+' done today.</span></div>';
  }
  v.innerHTML='<div class="empty"><strong>All five done for today.</strong><span>You’re finished. Nice work.</span></div>'+extra;
  const b=document.getElementById("bonus");if(b)b.onclick=serveBonus;
}
function renderBonusCard(v,s){
  const m=meta();
  v.innerHTML='<div class="card"><div class="tag stretch">BONUS '+m.bonusDone+' OF '+MAX_BONUS+' · '+s.subject.toUpperCase()+' STRETCH</div><div class="body">'+
    '<p class="q">'+esc(s.prompt)+'</p>'+promptExtras(s)+
    (!shown
      ? '<p class="commit">'+esc(coachingFor(s))+'</p><button class="big" id="reveal-bonus">I’ve answered · Show answer</button>'
      : '<div class="a"><p>'+esc(s.answer)+'</p>'+answerExtras(s)+(s.note?'<p class="why">'+esc(s.note)+'</p>':'')+'</div>'+
        '<div class="row"><button class="miss" id="bonus-no">Missed it</button><button class="good" id="bonus-yes">Got it</button></div>')+
    '</div></div>';
  if(!shown)document.getElementById("reveal-bonus").onclick=()=>{shown=true;render();};
  else{
    document.getElementById("bonus-yes").onclick=()=>gradeBonus(s,true);
    document.getElementById("bonus-no").onclick=()=>gradeBonus(s,false);
  }
}
function gradeBonus(s,got){
  if(busy)return;busy=true;
  let promotedCardId=null,errAt=null;
  const ok=transact(st=>{
    if(st.meta.currentBonusId!==s.id)throw new Error("bonus changed");
    const x=st.stretchState[s.id]||{lastSeen:today(),lastServedAt:Date.now(),promoted:false,lastResult:""};
    x.lastResult=got?"got":"missed";
    if(got){
      st.stretchState[s.id]=x;
      st.meta.currentBonusId=null;
      return;
    }

    const pid=promotionId(s.id);
    let c=st.cards.find(card=>card.id===pid||card.sourceStretchId===s.id);
    if(!c){
      c=createPromotedCard(s);
      st.cards.push(c);
      errAt=c.errors[0].at;
    }else{
      promotedCardId=c.id;
      if(!x.promoted){
        applyReviewState(c,false);
        errAt=appendError(c,"stretch").at;
      }
    }
    x.promoted=true;st.stretchState[s.id]=x;
    st.meta.currentBonusId=null;
    promotedCardId=c.id;
  });
  busy=false;shown=false;
  if(!ok){render();return;}
  if(got){render();return;}
  if(promotedCardId&&errAt){pendingClassify={cardId:promotedCardId,errorAt:errAt};}
  render();
}

/* 19e.1 Mistake Review: every missed Beacon card becomes a prefilled review exercise. */
function pendingMistakes(){
  const out=[];
  state.cards.forEach(card=>{
    (card.errors||[]).forEach(err=>{
      if(!err.reviewedAt)out.push({card,err});
    });
  });
  return out.sort((a,b)=>(a.err.at||0)-(b.err.at||0));
}
function reviewReason(item,type){
  if(busy)return;busy=true;
  const ok=transact(st=>{
    const c=st.cards.find(x=>x.id===item.card.id);if(!c)throw new Error("missing review card");
    const e=(c.errors||[]).find(x=>x.at===item.err.at);if(!e)throw new Error("missing review error");
    e.type=type;c.lastErrorType=type;
  });
  busy=false;if(ok)render();else renderNotices();
}
function completeMistakeReview(item){
  if(busy)return;
  const remember=(document.getElementById("review-remember")?.value||"").trim();
  if(!item.err.type){
    storageWarning="Choose what went wrong before completing this review.";render();return;
  }
  busy=true;
  const ok=transact(st=>{
    const c=st.cards.find(x=>x.id===item.card.id);if(!c)throw new Error("missing review card");
    const e=(c.errors||[]).find(x=>x.at===item.err.at);if(!e)throw new Error("missing review error");
    e.reviewedAt=Date.now();e.remember=remember;
  });
  busy=false;
  if(ok){storageWarning="";reviewSuccess="You’re all set to ace this the next time it pops up.";render();}
  else renderNotices();
}
function renderReviewMistakes(v){
  const pending=pendingMistakes();
  if(reviewSuccess){
    const hasMore=pending.length>0;
    v.innerHTML='<div class="caught" style="padding:22px"><strong>'+esc(reviewSuccess)+'</strong>'+
      '<div style="margin-top:12px"><button class="big" id="review-next">'+(hasMore?'Review next mistake':'Back to Today')+'</button></div></div>';
    document.getElementById("review-next").onclick=()=>{reviewSuccess="";if(!hasMore)tab="today";render();};
    return;
  }
  if(!pending.length){
    v.innerHTML='<div class="empty"><strong>No mistakes waiting.</strong><span>When you miss a Beacon card, the question, what went wrong and the model answer will be saved here automatically.</span></div>';
    return;
  }
  const item=pending[0],c=item.card,e=item.err;
  const remember=e.remember||c.note||"";
  const reason=e.type
    ? '<div class="choice-grid"><button class="on" style="grid-column:1/-1">'+esc(e.type)+'</button></div>'
    : '<div class="choice-grid">'+ERROR_TYPES.map(t=>'<button data-review-error="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>';
  v.innerHTML='<div class="card"><div class="tag '+c.subject+'">MISTAKE REVIEW · '+c.subject.toUpperCase()+' · 1 OF '+pending.length+'</div><div class="body">'+
    '<label>THE QUESTION</label><p class="q">'+esc(c.prompt)+'</p>'+promptExtras(c)+
    '<label>WHAT WENT WRONG?</label>'+reason+
    (e.note?'<div class="commit"><strong>Your note:</strong> '+esc(e.note)+'</div>':'')+
    '<label>WHAT THE ANSWER SHOULD BE</label><div class="a"><p>'+esc(c.answer)+'</p>'+answerExtras(c)+'</div>'+
    '<label>WHAT SHOULD I REMEMBER NEXT TIME?</label><textarea id="review-remember" rows="3" placeholder="One short thing to remember">'+esc(remember)+'</textarea>'+
    '<button class="big" id="complete-review">I’ve reviewed this</button>'+
    '<div class="tiny">Beacon will bring this question back at the next useful review.</div>'+
    '</div></div>';
  v.querySelectorAll("[data-review-error]").forEach(b=>b.onclick=()=>reviewReason(item,b.dataset.reviewError));
  document.getElementById("complete-review").onclick=()=>completeMistakeReview(item);
}

function cardStatus(c){
  const exam=examFor(c.subject);
  if(today()>=exam)return "Paper completed";
  if(needsFinalSweep(c))return "Final review due";
  return "Box "+((Number(c.box)||0)+1)+" · next on "+new Date(c.due).toLocaleDateString();
}
function renderAll(v){
  v.innerHTML=state.cards.map(c=>'<div class="item"><span class="pill '+c.subject+'">'+c.subject.slice(0,4).toUpperCase()+'</span><div class="txt">'+
    esc(c.prompt.slice(0,90))+(c.prompt.length>90?'…':'')+'<div class="meta">'+esc(cardStatus(c))+
    (c.origin==="mistake"?' · MY MISTAKE':'')+(c.source==="stretch"?' · FROM STRETCH':'')+
    (c.lastErrorType?' · '+esc(c.lastErrorType):'')+'</div>'+
    '</div></div>').join("");
}

function doExport(){
  const payload={
    product:"The Beacon",version:"20b",exportedAt:new Date().toISOString(),
    cards:state.cards,meta:state.meta,stretchState:state.stretchState,englishPrecision:epState
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"),url=URL.createObjectURL(blob);
  a.href=url;a.download="the-beacon-backup-20b.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  writeLocal("beacon-last-backup",String(Date.now()));renderNotices();
}
function restorePayload(data){
  if(Array.isArray(data)){
    if(!data.length||!data.every(c=>c&&c.prompt&&c.subject&&c.answer))throw new Error("bad legacy");
    return {core:newState(data,null,{}),english:null};
  }
  if(data&&Array.isArray(data.cards)&&data.cards.length&&data.cards.every(c=>c&&c.prompt&&c.subject&&c.answer)){
    return {core:newState(data.cards,data.meta,data.stretchState||{}),english:data.englishPrecision?normalizeEnglishState(data.englishPrecision):null};
  }
  throw new Error("bad backup");
}

document.getElementById("t-today").onclick=()=>{tab="today";shown=false;pendingClassify=null;reviewSuccess="";render();};
document.getElementById("t-add").onclick=()=>{tab="add";shown=false;pendingClassify=null;reviewSuccess="";render();};
document.getElementById("t-all").onclick=()=>{tab="all";shown=false;pendingClassify=null;reviewSuccess="";render();};
document.getElementById("t-english").onclick=()=>{tab="english";shown=false;pendingClassify=null;reviewSuccess="";epError="";render();};
document.getElementById("export").onclick=doExport;
document.getElementById("restore").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result),next=restorePayload(data);
      if(!confirm("Replace the current Beacon with "+next.core.cards.length+" cards from this backup?"))return;
      const before=clone(state),beforeEnglish=clone(epState);state=next.core;reconcileStretchState();
      if(next.english)epState=next.english;
      if(!persistState(true)||!persistEnglishPrecision(false)){state=before;epState=beforeEnglish;throw new Error("save failed");}
      writeLocal("beacon-last-backup",String(Date.now()));tab="today";shown=false;pendingClassify=null;reviewSuccess="";render();
      alert("Restored "+state.cards.length+" cards"+(next.english?" plus English Precision data":". Your existing English Precision data was preserved")+".");
    }catch(err){alert("That file does not look like a Beacon backup.");}
  };
  r.readAsText(f);e.target.value="";
};

load();loadEnglishPrecision();render();
</script>
