<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beacon Deck">
<meta name="theme-color" content="#12305C">
<title>The Beacon Deck</title>
<style>
  :root{--ink:#0B1F3F;--night:#12305C;--beam:#F2B01E;--sand:#FAF6EF;--slate:#4A5B72;
        --rule:rgba(11,31,63,.14);--good:#1F7A55;--miss:#B23A2E}
  html{color-scheme:light only}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#FAF6EF}
  body{color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}

  header{background:var(--night);color:#fff;border-radius:6px;padding:22px 20px;
         padding-top:calc(22px + env(safe-area-inset-top))}
  .eyebrow{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--beam);margin:0 0 6px}
  h1{font-family:Georgia,serif;font-size:28px;margin:0 0 6px;font-weight:700}
  header p{margin:0;font-size:13.5px;color:rgba(255,255,255,.82)}

  nav{display:flex;gap:6px;margin:18px 0}
  nav button{flex:1;padding:10px 4px;font-size:13px;font-weight:600;border-radius:5px;
             border:1px solid var(--rule);background:#fff;color:var(--slate);cursor:pointer}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .card{background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .tag{padding:9px 16px;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#fff}
  .Maths{background:#1E3A8A}.Science{background:#166534}
  .English{background:#B45309}.Chinese{background:#9F1239}
  .body{padding:22px 20px}
  .q{font-size:17px;line-height:1.5;margin:0 0 22px}
  .a{border-left:4px solid var(--beam);padding-left:14px;margin-bottom:18px}
  .a p{margin:0 0 8px}
  .a .why{font-size:13.5px;color:var(--slate);font-style:italic;margin:0}

  button.big{width:100%;padding:14px;border:none;border-radius:5px;font-size:15px;
             font-weight:700;color:#fff;background:var(--night);cursor:pointer}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:14px;border:none;border-radius:5px;font-size:15px;
              font-weight:700;color:#fff;cursor:pointer}
  .miss{background:var(--miss)}.good{background:var(--good)}

  label{display:block;font-size:10.5px;letter-spacing:.12em;font-weight:700;
        color:var(--slate);margin:0 0 6px}
  textarea,input{width:100%;border:1px solid #cbd5e1;border-radius:5px;padding:11px;
                 font:inherit;font-size:15px;margin-bottom:16px;background:#fff;color:var(--ink)}
  textarea{resize:vertical}
  .subs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .subs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:5px;
               font-size:13px;font-weight:600;background:#e8eaee;color:var(--slate);cursor:pointer}
  .subs button.on{background:var(--ink);color:#fff}

  .item{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px 14px;
        margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
  .pill{font-size:9.5px;font-weight:700;color:#fff;padding:4px 7px;border-radius:4px;flex:0 0 auto}
  .item .txt{flex:1;min-width:0;font-size:13.5px}
  .item .meta{font-size:11.5px;color:#94a3b8;margin-top:3px}

  .empty{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:40px 24px;text-align:center}
  .empty strong{display:block;font-size:18px;margin-bottom:6px}
  .empty span{font-size:14px;color:var(--slate)}
  .foot{margin-top:22px;text-align:center}
  .foot button{background:none;border:none;color:#94a3b8;font-size:12px;
               text-decoration:underline;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">PROJECT LIGHTHOUSE 2.0</p>
    <h1>The Beacon Deck</h1>
    <p>Five cards, five minutes, at the end of the day. The ones you miss come back sooner.</p>
  </header>

  <nav>
    <button id="t-today" class="on">Today</button>
    <button id="t-add">Log a mistake</button>
    <button id="t-all">All cards</button>
  </nav>

  <main id="view"></main>

  <div class="foot">
    <button id="export">Back up my cards</button>
    <button id="restore">Restore from backup</button>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <div style="font-size:11px;color:#b6bfcb;margin-top:2px">Build 2026-08-19c</div>
  </div>
</div>

<script>
const DAY=86400000, INTERVALS=[1,3,7,14,30];
const today=()=>new Date().setHours(0,0,0,0);
const SUBJECTS=["Maths","Science","English","Chinese"];

const SEED=[
["Maths","A tank is 3/5 filled. After 12 L more it is 7/10 full. What is its capacity?","120 L. The 12 L is 7/10 − 3/5 = 1/10 of the tank.","Find what fraction the added amount represents before anything else."],
["Maths","Boys : girls = 3 : 5. There are 24 more girls than boys. How many children altogether?","96. The difference is 2 units = 24, so 1 unit = 12, and 8 units = 96.","The difference in units is the bridge between the ratio and the real number."],
["Maths","A car covers 180 km in 2 h 30 min. What is its average speed?","72 km/h. 180 ÷ 2.5.","Convert minutes into a decimal or fraction of an hour before dividing."],
["Maths","Find the area of a quadrant of radius 14 cm. Take π as 22/7.","154 cm². A quarter of the full circle, which is 22/7 × 14 × 14 = 616.","Work out the whole circle first, then take the fraction."],
["Maths","An $80 item rises 15%, then is discounted 10%. What is the final price?","$82.80. 80 × 1.15 = 92, then 92 × 0.9.","Percentages apply one after another. They are never added together."],
["Maths","The angles of a triangle are in the ratio 2 : 3 : 4. Find the largest angle.","80°. 9 units = 180°, so 1 unit = 20°, and 4 units = 80°.","The total units always map onto 180° for a triangle."],
["Science","Why does a plant kept in a dark cupboard eventually die, even if it is watered?","Without light it cannot photosynthesise, so it cannot make food, and its stored food runs out.","Name the process and the reason. 'No sunlight' on its own will not score."],
["Science","A metal spoon feels colder than a wooden one in the same room. Explain why.","Metal is a better conductor of heat, so it conducts heat away from your hand faster.","Both are at the same temperature. The answer is about the rate of heat transfer."],
["Science","In a fair test on how light affects plant growth, name one variable you must keep the same.","The amount of water. Also: soil type, pot size, type of plant, temperature.","Change one thing, measure one thing, keep everything else the same."],
["Science","A seed has a papery wing. How is it dispersed, and how does that help the plant?","By wind. It lands further from the parent plant, so there is less competition for water, sunlight and nutrients.","Always add the benefit. The mark is usually in the 'why'."],
["Science","Name the stages of a butterfly's life cycle.","Egg → larva (caterpillar) → pupa → adult. This is complete metamorphosis.","Butterfly and beetle have four stages. Grasshopper and cockroach have three."],
["Science","Why do water droplets form on the outside of a cold glass?","Water vapour in the surrounding air loses heat to the cold glass and condenses into water droplets.","Say where the water came from. It did not leak through the glass."],
["English","Combine using 'Despite': 'He was exhausted. He kept working.'","Despite being exhausted, he kept working.","'Despite' is followed by a noun or an -ing verb, never by a full clause."],
["English","Choose: 'Neither of the boys (was / were) willing to admit it.'","was — 'neither' is singular.","Look past the words sitting between the subject and the verb."],
["English","What does 'meticulous' mean? Use it in a sentence.","Extremely careful about detail. 'She kept meticulous notes of every experiment.'","Give the meaning and a natural sentence. One without the other rarely scores."],
["English","Rewrite in reported speech: 'I will finish it tomorrow,' she said.","She said that she would finish it the following day.","Shift the tense back, and change the time word too."],
["English","Choose: 'The news (is / are) encouraging.'","is — 'news' is uncountable.","Uncountable nouns take a singular verb even when they end in -s."],
["Chinese","一丝不苟 是什么意思？","形容做事非常认真细致，一点也不马虎。","成语题先想清楚它形容的是态度还是结果。"],
["Chinese","兴高采烈 用在什么情况？请造一个句子。","形容非常高兴。例：听到可以去露营，大家都兴高采烈。","成语要放进完整的句子里才算真正掌握。"],
["Chinese","填量词：一（  ）书、一（  ）花、一（  ）马","一本书、一朵花、一匹马。","量词要一组一组地记，不要单个背。"],
["Chinese","用「虽然……但是……」造一个句子。","例：虽然天气很热，但是他还是坚持跑步。","关联词要成对使用，前后句的意思要相反。"]
];

let cards, tab="today", shown=false;
let form={subject:"Maths",prompt:"",answer:"",note:""};

/* ---- daily composition: edit this one line to reweight the deck ---------- */
const PLAN=["Science","Science","Maths","Language","Any"];
const LANG=["English","Chinese"];

/* 19c: explicit provenance. Older 19b cards are migrated by id prefix. */
function normalizeCard(c){
  return {...c, origin:c.origin || (String(c.id||"").startsWith("m-") ? "mistake" : "seed")};
}
function normalizeDeck(list){return list.map(normalizeCard);}

function load(){
  try{
    const raw=localStorage.getItem("beacon-deck");
    if(raw){cards=normalizeDeck(JSON.parse(raw));save();return;}
  }catch(e){}
  cards=SEED.map((s,i)=>({id:"seed-"+i,subject:s[0],prompt:s[1],answer:s[2],note:s[3],box:0,due:today(),seen:0,origin:"seed"}));
  save();
}
function save(){
  try{localStorage.setItem("beacon-deck",JSON.stringify(cards));}catch(e){}
}
function meta(){
  try{const m=JSON.parse(localStorage.getItem("beacon-meta"));
      if(m&&m.date===today())return m;}catch(e){}
  return {date:today(),done:0};
}
function setMeta(m){
  try{localStorage.setItem("beacon-meta",JSON.stringify(m));}catch(e){}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* logged mistakes and previously missed reviews first, then most overdue */
function priorityMiss(c){
  return (c.origin==="mistake"&&c.box===0) || (c.box===0&&c.seen>0);
}
function rank(a,b){
  const ma=priorityMiss(a)?0:1, mb=priorityMiss(b)?0:1;
  if(ma!==mb)return ma-mb;
  return a.due-b.due;
}
function pool(){return cards.filter(c=>c.due<=today());}
function remaining(){return Math.max(0,Math.min(PLAN.length-meta().done,pool().length));}

function nextCard(){
  const m=meta();
  if(m.done>=PLAN.length)return null;
  const p=pool();
  if(!p.length)return null;
  const slot=PLAN[m.done];
  const want = slot==="Language" ? LANG : slot==="Any" ? null : [slot];
  let list = want ? p.filter(c=>want.indexOf(c.subject)>-1) : p.slice();
  if(!list.length) list = p.slice();
  return list.sort(rank)[0];
}

function render(){
  const v=document.getElementById("view");
  document.getElementById("t-today").textContent="Today ("+remaining()+")";
  document.getElementById("t-all").textContent="All cards ("+cards.length+")";
  ["today","add","all"].forEach(t=>
    document.getElementById("t-"+t).classList.toggle("on",tab===t));

  if(tab==="today") return renderToday(v);
  if(tab==="add")   return renderAdd(v);
  renderAll(v);
}

function renderToday(v){
  const c=nextCard(), m=meta();
  if(!c){
    const finished=m.done>=PLAN.length;
    v.innerHTML='<div class="empty"><strong>'+
      (finished?"All five done for today.":"Nothing due today.")+'</strong>'+
      '<span>'+(finished
        ? "Come back tomorrow, or log a mistake from today's work."
        : "Log a mistake from today's work and it will be here tomorrow.")+
      '</span></div>';
    return;
  }
  v.innerHTML=
    '<div class="card"><div class="tag '+c.subject+'">'+c.subject.toUpperCase()+
    ' \u00b7 CARD '+(m.done+1)+' OF '+PLAN.length+'</div><div class="body">'+
    '<p class="q">'+esc(c.prompt)+'</p>'+
    (!shown
      ? '<button class="big" id="reveal">Show the answer</button>'
      : '<div class="a"><p>'+esc(c.answer)+'</p>'+
        (c.note?'<p class="why">'+esc(c.note)+'</p>':'')+'</div>'+
        '<div class="row"><button class="miss" id="no">Missed it</button>'+
        '<button class="good" id="yes">Got it</button></div>')+
    '</div></div>';

  if(!shown){
    document.getElementById("reveal").onclick=()=>{shown=true;render();};
  }else{
    document.getElementById("no").onclick=()=>grade(c,false);
    document.getElementById("yes").onclick=()=>grade(c,true);
  }
}

/* the queue rebuilds itself from position zero — never advance a pointer here */
function grade(c,got){
  const box=got?Math.min(c.box+1,INTERVALS.length-1):0;
  c.box=box; c.due=today()+INTERVALS[box]*DAY; c.seen++;
  const m=meta(); m.done++; setMeta(m);
  save(); shown=false; render();
}

function renderAdd(v){
  v.innerHTML=
    '<div class="card"><div class="body">'+
    '<p style="font-size:13.5px;color:var(--slate);margin:0 0 18px">'+
    'After marking a paper, put the mistake in here. It comes back tomorrow, then in three days, then in a week.</p>'+
    '<label>SUBJECT</label><div class="subs">'+
    SUBJECTS.map(s=>'<button data-s="'+s+'"'+(form.subject===s?' class="on"':'')+'>'+s+'</button>').join("")+
    '</div>'+
    '<label>THE QUESTION</label><textarea id="f-q" rows="3" placeholder="Write it the way it appeared on the paper">'+esc(form.prompt)+'</textarea>'+
    '<label>THE CORRECT ANSWER</label><textarea id="f-a" rows="2">'+esc(form.answer)+'</textarea>'+
    '<label>WHY I GOT IT WRONG</label><input id="f-n" placeholder="Misread it · forgot the unit · rushed" value="'+esc(form.note)+'">'+
    '<button class="big" id="save-card">Add to the deck</button>'+
    '</div></div>';

  v.querySelectorAll(".subs button").forEach(b=>b.onclick=()=>{
    form.subject=b.dataset.s; syncForm(); render();
  });
  document.getElementById("save-card").onclick=()=>{
    syncForm();
    if(!form.prompt.trim()||!form.answer.trim())return;
    cards.push({id:"m-"+Date.now(),subject:form.subject,prompt:form.prompt,
                answer:form.answer,note:form.note,box:0,due:today(),seen:0,origin:"mistake"});
    save();
    form={subject:form.subject,prompt:"",answer:"",note:""};
    tab="today"; shown=false; render();
  };
}
function syncForm(){
  const q=document.getElementById("f-q");
  if(q){form.prompt=q.value;form.answer=document.getElementById("f-a").value;
        form.note=document.getElementById("f-n").value;}
}

function renderAll(v){
  v.innerHTML=cards.map(c=>
    '<div class="item"><span class="pill '+c.subject+'">'+c.subject.slice(0,4).toUpperCase()+'</span>'+
    '<div class="txt">'+esc(c.prompt.slice(0,90))+(c.prompt.length>90?'…':'')+
    '<div class="meta">Box '+(c.box+1)+' · next on '+new Date(c.due).toLocaleDateString()+'</div>'+
    '</div></div>').join("");
}

document.getElementById("t-today").onclick=()=>{tab="today";shown=false;render();};
document.getElementById("t-add").onclick=()=>{tab="add";render();};
document.getElementById("t-all").onclick=()=>{tab="all";render();};
document.getElementById("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="beacon-deck-backup.json";
  a.click();
};
document.getElementById("restore").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data)||!data.length||!data[0].prompt)throw 0;
      if(!confirm("Replace the current deck with "+data.length+" cards from this backup?"))return;
      cards=normalizeDeck(data); save(); tab="today"; shown=false; render();
      alert("Restored "+data.length+" cards.");
    }catch(err){ alert("That file does not look like a Beacon Deck backup."); }
  };
  r.readAsText(f);
  e.target.value="";
};

load(); render();
</script>
</body>
</html>
