const CONTENT={"seed":[{"id":"seed-0","subject":"Maths","prompt":"A tank is 3/5 filled. After 12 L more it is 7/10 full. What is its capacity?","answer":"120 L. The 12 L is 7/10 − 3/5 = 1/10 of the tank.","note":"Find what fraction the added amount represents before anything else."},{"id":"seed-1","subject":"Maths","prompt":"Boys : girls = 3 : 5. There are 24 more girls than boys. How many children altogether?","answer":"96. The difference is 2 units = 24, so 1 unit = 12, and 8 units = 96.","note":"The difference in units is the bridge between the ratio and the real number."},{"id":"seed-2","subject":"Maths","prompt":"A car covers 180 km in 2 h 30 min. What is its average speed?","answer":"72 km/h. 180 ÷ 2.5.","note":"Convert minutes into a decimal or fraction of an hour before dividing."},{"id":"seed-3","subject":"Maths","prompt":"Find the area of a quadrant of radius 14 cm. Take π as 22/7.","answer":"154 cm². A quarter of the full circle, which is 22/7 × 14 × 14 = 616.","note":"Work out the whole circle first, then take the fraction."},{"id":"seed-4","subject":"Maths","prompt":"An $80 item rises 15%, then is discounted 10%. What is the final price?","answer":"$82.80. 80 × 1.15 = 92, then 92 × 0.9.","note":"Percentages apply one after another. They are never added together."},{"id":"seed-5","subject":"Maths","prompt":"The angles of a triangle are in the ratio 2 : 3 : 4. Find the largest angle.","answer":"80°. 9 units = 180°, so 1 unit = 20°, and 4 units = 80°.","note":"The total units always map onto 180° for a triangle."},{"id":"seed-6","subject":"Science","prompt":"Why does a plant kept in a dark cupboard eventually die, even if it is watered?","answer":"Without light it cannot photosynthesise, so it cannot make food, and its stored food runs out.","note":"Name the process and the reason. 'No sunlight' on its own will not score."},{"id":"seed-7","subject":"Science","prompt":"A metal spoon feels colder than a wooden one in the same room. Explain why.","answer":"Metal is a better conductor of heat, so it conducts heat away from your hand faster.","note":"Both are at the same temperature. The answer is about the rate of heat transfer."},{"id":"seed-8","subject":"Science","prompt":"In a fair test on how light affects plant growth, name one variable you must keep the same.","answer":"The amount of water. Also: soil type, pot size, type of plant, temperature.","note":"Change one thing, measure one thing, keep everything else the same."},{"id":"seed-9","subject":"Science","prompt":"A seed has a papery wing. How is it dispersed, and how does that help the plant?","answer":"By wind. It lands further from the parent plant, so there is less competition for water, sunlight and nutrients.","note":"Always add the benefit. The mark is usually in the 'why'."},{"id":"seed-10","subject":"Science","prompt":"Name the stages of a butterfly's life cycle.","answer":"Egg → larva (caterpillar) → pupa → adult. This is complete metamorphosis.","note":"Butterfly and beetle have four stages. Grasshopper and cockroach have three."},{"id":"seed-11","subject":"Science","prompt":"Why do water droplets form on the outside of a cold glass?","answer":"Water vapour in the surrounding air loses heat to the cold glass and condenses into water droplets.","note":"Say where the water came from. It did not leak through the glass."},{"id":"seed-12","subject":"English","prompt":"Combine using 'Despite': 'He was exhausted. He kept working.'","answer":"Despite being exhausted, he kept working.","note":"'Despite' is followed by a noun or an -ing verb, never by a full clause."},{"id":"seed-13","subject":"English","prompt":"Choose: 'Neither of the boys (was / were) willing to admit it.'","answer":"was — 'neither' is singular.","note":"Look past the words sitting between the subject and the verb."},{"id":"seed-14","subject":"English","prompt":"What does 'meticulous' mean? Use it in a sentence.","answer":"Extremely careful about detail. 'She kept meticulous notes of every experiment.'","note":"Give the meaning and a natural sentence. One without the other rarely scores."},{"id":"seed-15","subject":"English","prompt":"Rewrite in reported speech: 'I will finish it tomorrow,' she said.","answer":"She said that she would finish it the following day.","note":"Shift the tense back, and change the time word too."},{"id":"seed-16","subject":"English","prompt":"Choose: 'The news (is / are) encouraging.'","answer":"is — 'news' is uncountable.","note":"Uncountable nouns take a singular verb even when they end in -s."},{"id":"seed-17","subject":"Chinese","prompt":"一丝不苟 是什么意思？","answer":"形容做事非常认真细致，一点也不马虎。","note":"成语题先想清楚它形容的是态度还是结果。","promptPinyin":"yī sī bù gǒu shì shén me yì si?","answerPinyin":"xíng róng zuò shì fēi cháng rèn zhēn xì zhì, yì diǎn yě bù mǎ hu.","answerGloss":"一丝不苟 (yī sī bù gǒu): meticulous; extremely careful and thorough."},{"id":"seed-18","subject":"Chinese","prompt":"兴高采烈 用在什么情况？请造一个句子。","answer":"形容非常高兴。例：听到可以去露营，大家都兴高采烈。","note":"成语要放进完整的句子里才算真正掌握。","promptPinyin":"xìng gāo cǎi liè yòng zài shén me qíng kuàng? qǐng zào yí ge jù zi.","answerPinyin":"xíng róng fēi cháng gāo xìng. lì: tīng dào kě yǐ qù lù yíng, dà jiā dōu xìng gāo cǎi liè.","answerGloss":"兴高采烈 (xìng gāo cǎi liè): delighted; in very high spirits."},{"id":"seed-19","subject":"Chinese","prompt":"填量词：一（  ）书、一（  ）花、一（  ）马","answer":"一本书、一朵花、一匹马。","note":"量词要一组一组地记，不要单个背。","promptPinyin":"tián liàng cí: yì (  ) shū, yì (  ) huā, yì (  ) mǎ.","answerPinyin":"yì běn shū, yì duǒ huā, yì pǐ mǎ.","answerGloss":"Measure words: 本 (běn) for books, 朵 (duǒ) for flowers, 匹 (pǐ) for horses."},{"id":"seed-20","subject":"Chinese","prompt":"用「虽然……但是……」造一个句子。","answer":"例：虽然天气很热，但是他还是坚持跑步。","note":"关联词要成对使用，前后句的意思要相反。","promptPinyin":"yòng 'suī rán……dàn shì……' zào yí ge jù zi.","answerPinyin":"lì: suī rán tiān qì hěn rè, dàn shì tā hái shì jiān chí pǎo bù.","answerGloss":"虽然……但是…… (suī rán… dàn shì…): although… but…"}],"stretch":[{"id":"s:stretch-sci-002","subject":"Science","prom v.innerHTML+='<div class="card"><div class="body"><button class="btn" id="drill">Start 6-question Precision Sprint</button><button class="btn alt" id="vocab">Start 8-question Vocabulary Sweep</button>'+(d?'':'<button class="btn alt" id="diag">Start 15-question diagnostic</button>')+'<details><summary>Historical assessments and human review</summary><p class="small">Imported human-review decisions remain preserved in the JSON state; no historical profile is automatically assigned to a new learner.</p>'+english.drillHistory.slice(-10).reverse().map(h=>'<div class="item">'+new Date(h.completedAt).toLocaleDateString()+' · '+h.score+'/'+h.max+' raw'+(h.review20e?' · human reviewed 20e':h.review20d?' · human reviewed 20d':h.review20c?' · human reviewed 20c':'')+'</div>').join('')+'</details></div></div>';$('drill').onclick=()=>startEnglish('drill');$('vocab').onclick=()=>startEnglish('vocab');if($('diag'))$('diag').onclick=()=>startEnglish('diagnostic')}
function renderEnglishActive(v,a){const vocab=a.kind==='vocab',diag=a.kind==='diagnostic',ids=a.questionIds||CONTENT.diagnostic.map(x=>x.id),q=vocab?vocabQuestion(ids[a.index]):englishQuestion(ids[a.index]);if(!q){v.innerHTML+='<div class="notice">Question not found in this reconstructed bank. The session is preserved: please export your backup.</div><button class="btn alt" id="cancel">Return to profile (preserve history)</button>';$('cancel').onclick=()=>tx(()=>{english.active=null;render()});return}let r=a.responses[q.id],done=!!a.feedback;if(diag){let phase=a.phase||'first';if(phase==='review')r=r||{};}
v.innerHTML+='<div class="card"><div class="tag">'+esc(a.kind.toUpperCase())+' · '+(a.index+1)+' OF '+ids.length+(diag?' · '+a.phase:'')+'</div><div class="body"><p class="q">'+esc(vocab?'Choose the most precise meaning or fit: '+q.term:q.context)+'</p>'+(vocab?'<div>'+q.options.map((op,i)=>'<button class="choice '+(a.choice===i?'sel':'')+'" data-choice="'+i+'">'+('ABCD'[i])+'. '+esc(op)+'</button>').join('')+'</div>':(done?'<div class="hint">Your answer: '+esc(r?.answer)+'</div>':(q.section==='Cloze'?'<input id="epanswer" placeholder="Enter one word" value="'+esc(a.typed|| (a.phase==='review'?r?.firstAnswer:'')||'')+'">':'<textarea id="epanswer" placeholder="Write the transformed sentence">'+esc(a.typed||(a.phase==='review'?r?.firstAnswer:'')||'')+'</textarea>')))+(!done&&a.phase!=='review'?'<label>CONFIDENCE</label><div class="chiprow">'+[1,2,3].map(x=>'<button data-confidence="'+x+'" class="'+(a.confidence===x?'sel':'')+'">'+x+' · '+['','Unsure','Think so','Certain'][x]+'</button>').join('')+'</div>':'')+(done?'<div class="'+(r.correct?'goodbox':'badbox')+'"><b>'+(r.correct?'Verified':'Review carefully')+'</b><div>'+esc(q.answer)+'</div></div>':'')+'<button class="btn" id="epaction">'+(done?'Next':diag&&a.phase==='first'&&a.index===ids.length-1?'Begin neutral review':diag&&a.phase==='review'&&a.index===ids.length-1?'Finish diagnostic':'Submit answer')+'</button><button class="btn alt" id="epexit">Return to English dashboard (keep session)</button></div></div>';
if(vocab&&!done)v.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>tx(()=>{a.choice=Number(b.dataset.choice);render()}));if(!done)v.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>tx(()=>{a.confidence=Number(b.dataset.confidence);const fld=$('epanswer');if(fld)a.typed=fld.value;render()}));$('epexit').onclick=()=>{tab='settings';render();notice='Session saved; open English Precision to resume.'};$('epaction').onclick=()=>{if(done){tx(()=>{a.feedback=false;a.choice=null;a.confidence=0;a.typed='';a.index++;if(a.index>=ids.length)finishEnglish(a);render()});return}const val=vocab?a.choice:$('epanswer')?.value.trim();if(val==null||val===''){notice='Answer first.';render();return}if(a.phase!=='review'&&!a.confidence){notice='Choose a confidence level first.';a.typed=String(val);render();return}notice='';tx(()=>{if(diag){const old=a.responses[q.id]||{};if(a.phase==='first')Object.assign(old,{firstAnswer:val,finalAnswer:val,confidence:a.confidence});else old.finalAnswer=val;a.responses[q.id]=old;a.index++;a.typed='';a.confidence=0;if(a.index>=ids.length){if(a.phase==='first'){a.phase='review';a.index=0}else finishEnglish(a)}}else{const right=vocab?val===q.correctIndex:correct(q,val);a.responses[q.id]={answer:vocab?q.options[val]:val,choice:vocab?val:undefined,confidence:a.confidence,correct:right,answeredAt:now()};a.feedback=true}render()})}}
function finishEnglish(a){if(a.kind==='diagnostic'){let raw=0,fin=0,max=0,weak={};for(const id of a.questionIds){const q=englishQuestion(id),r=a.responses[id]||{};max+=q.weight;if(correct(q,r.firstAnswer))raw+=q.weight;if(correct(q,r.finalAnswer))fin+=q.weight;else q.tags.forEach(t=>weak[t]=(weak[t]||0)+1)}english.diagnostic={completedAt:now(),startedAt:a.startedAt,responses:a.responses,summary:{firstScore:raw,finalScore:fin,maxScore:max,catches:0,overthinks:0,highConfidenceMisses:0,avoidableMarksRecovered:Math.max(0,fin-raw),avoidabilityRatio:0,weakTags:Object.entries(weak).map(([tag,score])=>({tag,score}))}};english.profile={updatedAt:now(),weakTags:english.diagnostic.summary.weakTags}}else{let score=0,max=0,missTags=[];for(const id of a.questionIds){const q=a.kind==='vocab'?vocabQuestion(id):englishQuestion(id),r=a.responses[id];max+=a.kind==='vocab'?1:q.weight;if(r?.correct)score+=a.kind==='vocab'?1:q.weight;else missTags.push(...(a.kind==='vocab'?[q.tag]:q.tags))}const h={completedAt:now(),tier:a.tier,score,max,questionIds:a.questionIds,responses:a.responses,missTags};if(a.kind==='vocab'){english.vocabHistory.push(h);english.vocabProfile={updatedAt:now(),tier:a.tier,weakTags:missTags.map(tag=>({tag,score:1}))}}else english.drillHistory.push(h)}english.active=null}
function renderSettings(v){v.innerHTML='<h2>Learner and study settings</h2><p class="small">Configurations are local to this browser. Multi-user accounts and cloud synchronisation are not part of 20f.</p><div class="card"><div class="body"><label>STUDY MODE</label><select id="mode"><option value="continuous">Continuous Mastery (no exam cutoff)</option><option value="psle">PSLE Preparation (exam-aware)</option></select><label>LEVEL</label><select id="level"><option>P5</option><option>P6</option></select><label>LEARNER DISPLAY LABEL</label><input id="name" maxlength="40"><p class="small">Optional subject exam cutoffs (YYYY-MM-DD). Blank means no cutoff for that subject.</p>'+['English','Maths','Science','Chinese'].map(s=>'<label>'+s.toUpperCase()+' EXAM DATE</label><input type="date" data-exam="'+s+'" value="'+esc(config.exams?.[s]||'')+'">').join('')+'<button class="btn" id="savecfg">Save settings</button></div></div><div class="card"><div class="body"><b>Data and diagnostics</b><p class="small">Core cards: '+state.cards.length+' · English sprints: '+english.drillHistory.length+' · Vocabulary: '+english.vocabHistory.length+' · Unfinished session: '+(english.active?'yes':'no')+'</p><button class="btn" id="export2">Export full backup</button><button class="btn alt" id="restore2">Restore full backup</button><p class="small">20e import preserves historical human adjudications and review timelines. The new app does not automatically reenact D1-specific profile rewrites.</p></div></div>';$('mode').value=config.mode;$('level').value=config.level;$('name').value=config.name;$('savecfg').onclick=()=>tx(()=>{config.mode=$('mode').value;config.level=$('level').value;config.name=$('name').value;config.exams={};v.querySelectorAll('[data-exam]').forEach(x=>{if(x.value)config.exams[x.dataset.exam]=x.value});daily=newDaily();reveal=false;render()});$('export2').onclick=exportBackup;$('restore2').onclick=()=>$('file').click()}
function exportBackup(){const payload={product:'The Beacon',version:'20f',exportedAt:new Date().toISOString(),cards:state.cards,meta:state.meta,stretchState:state.stretchState,englishPrecision:english,config20f:config,daily20f:daily};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-beacon-backup-20f-'+dayId()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);try{localStorage.setItem('beacon-last-backup',String(now()))}catch{}}
function validPayload(x){if(!x||typeof x!=='object'||!Array.isArray(x.cards)||!x.cards.length||x.cards.length>30000)throw Error('Invalid core card array');const ids=new Set();for(const c of x.cards){if(!c||typeof c.id!=='string'||ids.has(c.id)||!['English','Chinese','Maths','Science'].includes(c.subject)||typeof c.prompt!=='string'||typeof c.answer!=='string'||c.prompt.length>20000||c.answer.length>20000||!c.prompt||!c.answer)throw Error('Invalid or duplicate card');ids.add(c.id)}if(x.englishPrecision!=null&&(typeof x.englishPrecision!=='object'||Array.isArray(x.englishPrecision)))throw Error('Invalid English Precision');if(x.englishPrecision?.drillHistory!=null&&!Array.isArray(x.englishPrecision.drillHistory))throw Error('Invalid drill histories');if(x.englishPrecision?.vocabHistory!=null&&!Array.isArray(x.englishPrecision.vocabHistory))throw Error('Invalid vocabulary histories');return true}
function restoreFile(file){if(file.size>20e6){alert('Backup too large');return}const reader=new FileReader();reader.onload=()=>{let payload;try{payload=JSON.parse(reader.result);validPayload(payload)}catch(e){alert('Backup rejected without changes: '+e.message);return}if(!confirm('Restore '+payload.cards.length+' cards and all included English learning data? Export your current backup first.'))return;const previous={core:safeRead(CORE_KEY),eng:safeRead(ENG_KEY),cfg:safeRead(CONFIG_KEY),daily:safeRead(DAILY_KEY)};const nextCore={version:'20f',cards:payload.cards.map(cardClean),meta:payload.meta||newCore().meta,stretchState:payload.stretchState||{}};const nextEng=payload.englishPrecision?{...newEng(),...payload.englishPrecision}:english;const nextCfg=payload.config20f?{...newCfg(),...payload.config20f}:config;const nextDaily=payload.daily20f?.date===dayId()?payload.daily20f:newDaily();const changes=[[CORE_KEY,nextCore],[ENG_KEY,nextEng],[CONFIG_KEY,nextCfg],[DAILY_KEY,nextDaily]];try{for(const [k,x] of changes){localStorage.setItem(k,JSON.stringify(x));if(JSON.stringify(JSON.parse(localStorage.getItem(k)))!==JSON.stringify(x))throw Error('Readback failed for '+k)}state=nextCore;english=nextEng;config=nextCfg;daily=nextDaily;notice='Restore completed. Your history has been preserved.';tab='today';reveal=false;render();alert('Restore complete: '+state.cards.length+' cards, '+english.drillHistory.length+' English sprints, '+english.vocabHistory.length+' vocabulary histories.')}catch(e){for(const [k,v] of [[CORE_KEY,previous.core],[ENG_KEY,previous.eng],[CONFIG_KEY,previous.cfg],[DAILY_KEY,previous.daily]])try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch{}load();notice='Restore did not complete. Previous data was restored where browser storage permitted. Keep your original backup.';render();alert(e.message)}};reader.readAsText(file)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;reveal=false;notice='';render()});$('quickexport').onclick=exportBackup;$('quickrestore').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files?.[0];if(f)restoreFile(f);e.target.value=''};load();render();
</script></body></html>
